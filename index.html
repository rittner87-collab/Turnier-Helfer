<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnier Helferkoordination</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  </style>
</head>
<body class="bg-zinc-950 text-white">
<div id="root"></div>
<script type="text/babel">

const firebaseConfig = {
  apiKey: "AIzaSyDdDD3INQExQJNYZ2ZdvhH55QNjMoR3DLQ",
  authDomain: "turnierhelfer-2027.firebaseapp.com",
  projectId: "turnierhelfer-2027",
  storageBucket: "turnierhelfer-2027.firebasestorage.app",
  messagingSenderId: "306397562073",
  appId: "1:306397562073:web:14c187226ab87d05eaaac8"
};
const APP_NAME        = 'Helferkoordination';
const TOURNAMENT_NAME = 'Internationales Fußballturnier 2027';

const TOURNAMENT_DAYS = [
  { id:'12.08.2027', label:'Mi 12.08.', note:'Aufbautag' },
  { id:'13.08.2027', label:'Do 13.08.', note:'' },
  { id:'14.08.2027', label:'Fr 14.08.', note:'' },
  { id:'15.08.2027', label:'Sa 15.08.', note:'' },
  { id:'16.08.2027', label:'So 16.08.', note:'Abbautag' },
];

const TOURNAMENT_GROUPS = [
  { name:'Turnierleitung',    icon:'🏆', color:'#8B5CF6', description:'Frank Rittner, Michel Kaden',        no_helpers:true  },
  { name:'Catering',          icon:'🍕', color:'#F97316', description:'Yvonne Rittner, Michel Kaden',       no_helpers:false },
  { name:'Helferkoordination',icon:'📋', color:'#3B82F6', description:'Doreen Lange, Hermann Kaden',        no_helpers:false },
  { name:'Unterkunft',        icon:'🏠', color:'#10B981', description:'Kathrin Muntschick, Stefan Müller',  no_helpers:false },
  { name:'Marketing',         icon:'📸', color:'#EC4899', description:'Frank Rittner, Social Media Team',   no_helpers:false },
  { name:'Sponsoring',        icon:'🤝', color:'#14B8A6', description:'Frank Rittner, Kathrin Muntschick',  no_helpers:false },
  { name:'Sicherheit',        icon:'🛡️', color:'#EF4444', description:'Thomas Kaufmann, Dennis Pflieger',   no_helpers:false },
  { name:'Sportliche Leitung',icon:'⚽', color:'#F59E0B', description:'Basti Klimm, René Richardt',         no_helpers:false },
];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
const ts   = () => firebase.firestore.FieldValue.serverTimestamp();
const { useState, useEffect, useCallback, useRef } = React;

const col      = (n) => db.collection(n);
const getDocs  = async (ref) => { const s=await ref.get(); return s.docs.map(d=>({id:d.id,...d.data()})); };
const getDoc_  = async (ref) => { const s=await ref.get(); return s.exists?{id:s.id,...s.data()}:null; };
const initials = (n='?') => (n||'?').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
const sortBy   = (arr,key,desc=false) => [...arr].sort((a,b)=>{ const va=a[key]||''; const vb=b[key]||''; return desc?(vb>va?1:-1):(va>vb?1:-1); });
const COLORS   = ['#dc2626','#b91c1c','#7f1d1d','#ef4444','#f87171','#991b1b','#450a0a','#fca5a5'];
const randColor= () => COLORS[Math.floor(Math.random()*COLORS.length)];

const seedGroups = async () => {
  const existing = await getDocs(col('groups'));
  if (existing.length > 0) return;
  const batch = db.batch();
  TOURNAMENT_GROUPS.forEach(g => { const ref=col('groups').doc(); batch.set(ref,{...g,created_at:ts()}); });
  await batch.commit();
};

// ── UI ───────────────────────────────────────────────────────
const Spinner = () => <div className="flex items-center justify-center p-10"><div className="w-8 h-8 border-4 border-zinc-700 border-t-red-500 rounded-full animate-spin"/></div>;

const Badge = ({color='red',children}) => {
  const c={red:'bg-red-500/20 text-red-400 border border-red-500/30',green:'bg-green-500/20 text-green-400 border border-green-500/30',yellow:'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',gray:'bg-zinc-700/60 text-zinc-300 border border-zinc-600',purple:'bg-purple-500/20 text-purple-400 border border-purple-500/30',blue:'bg-blue-500/20 text-blue-400 border border-blue-500/30',orange:'bg-orange-500/20 text-orange-400 border border-orange-500/30'};
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${c[color]||c.red}`}>{children}</span>;
};

const Avatar = ({name,color='#dc2626',size='md'}) => {
  const s=size==='sm'?'w-7 h-7 text-xs':size==='lg'?'w-12 h-12 text-lg':'w-9 h-9 text-sm';
  return <div className={`${s} rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 ring-2 ring-zinc-700`} style={{background:color}}>{initials(name)}</div>;
};

const Card = ({children,className='',onClick}) => (
  <div onClick={onClick} className={`bg-zinc-900 border border-zinc-800 rounded-2xl ${onClick?'cursor-pointer card-hover':''} ${className}`}>{children}</div>
);

const Modal = ({title,onClose,children,wide}) => (
  <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose}/>
    <div className={`relative bg-zinc-900 border border-zinc-700 rounded-2xl shadow-2xl w-full ${wide?'max-w-2xl':'max-w-lg'} max-h-[90vh] overflow-y-auto`}>
      <div className="flex items-center justify-between p-5 border-b border-zinc-700"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-1.5 rounded-lg hover:bg-zinc-800 text-zinc-400">✕</button></div>
      <div className="p-5">{children}</div>
    </div>
  </div>
);

const Inp = ({label,...p}) => (
  <div className="mb-4">
    {label&&<label className="block text-sm font-medium text-zinc-300 mb-1">{label}</label>}
    <input className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all" {...p}/>
  </div>
);

const Sel = ({label,children,...p}) => (
  <div className="mb-4">
    {label&&<label className="block text-sm font-medium text-zinc-300 mb-1">{label}</label>}
    <select className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all" {...p}>{children}</select>
  </div>
);

const Txt = ({label,...p}) => (
  <div className="mb-4">
    {label&&<label className="block text-sm font-medium text-zinc-300 mb-1">{label}</label>}
    <textarea className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent resize-none transition-all" rows={3} {...p}/>
  </div>
);

const Btn = ({variant='primary',size='md',className='',children,...p}) => {
  const v={primary:'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/30',secondary:'bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700',danger:'bg-red-900/40 hover:bg-red-900/60 text-red-400 border border-red-900/50',ghost:'hover:bg-zinc-800 text-zinc-400',green:'bg-emerald-600 hover:bg-emerald-500 text-white'};
  const s=size==='sm'?'px-3 py-1.5 text-xs':size==='lg'?'px-6 py-3 text-base':'px-4 py-2 text-sm';
  return <button className={`${v[variant]} ${s} rounded-xl font-medium transition-all disabled:opacity-40 ${className}`} {...p}>{children}</button>;
};

function Toast({msg,type='success',onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  const c={success:'bg-emerald-900 border-emerald-700 text-emerald-300',error:'bg-red-900 border-red-700 text-red-300',info:'bg-zinc-800 border-zinc-700 text-zinc-200',warning:'bg-yellow-900 border-yellow-700 text-yellow-300'};
  return <div className={`${c[type]||c.info} border px-5 py-3 rounded-xl shadow-2xl text-sm flex items-center gap-3 max-w-sm`}><span className="flex-1">{msg}</span><button onClick={onClose} className="opacity-60 hover:opacity-100">✕</button></div>;
}
function useToast() {
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type='success')=>setToasts(t=>[...t,{id:Date.now(),msg,type}]),[]);
  const rm=useCallback((id)=>setToasts(t=>t.filter(x=>x.id!==id)),[]);
  const Container=()=><div className="fixed bottom-5 right-5 z-[100] flex flex-col gap-2">{toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onClose={()=>rm(t.id)}/>)}</div>;
  return {show,Container};
}

const taskStatusLabel={open:'Offen',in_progress:'In Arbeit',done:'Erledigt'};
const taskStatusColor={open:'gray',in_progress:'yellow',done:'green'};
const priorityLabel={low:'Niedrig',normal:'Normal',high:'Hoch'};
const priorityColor={low:'blue',normal:'gray',high:'red'};

// ══════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════
function LoginPage() {
  const [tab,setTab]=useState('login');
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [name,setName]=useState('');
  const [groupId,setGroupId]=useState('');
  const [groups,setGroups]=useState([]);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');

  useEffect(()=>{getDocs(col('groups').orderBy('name')).then(g=>setGroups(g.filter(x=>!x.no_helpers)));},[]);

  const login=async(e)=>{e.preventDefault();setMsg('');setLoading(true);try{await auth.signInWithEmailAndPassword(email,pw);}catch(err){setMsg(err.message);}setLoading(false);};
  const register=async(e)=>{
    e.preventDefault();setMsg('');setLoading(true);
    try{
      if(!groupId){setMsg('Bitte eine Orgagruppe wählen.');setLoading(false);return;}
      const {user}=await auth.createUserWithEmailAndPassword(email,pw);
      const usersSnap=await col('users').limit(2).get();
      const isFirst=usersSnap.docs.filter(d=>d.id!==user.uid).length===0;
      await col('users').doc(user.uid).set({full_name:name,email,phone:'',role:isFirst?'admin':'helper',avatar_color:randColor(),group_id:groupId,created_at:ts()});
      await col('memberships').add({user_id:user.uid,group_id:groupId,role:'member',created_at:ts()});
    }catch(err){setMsg(err.message);}
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-zinc-950 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-gradient-to-br from-red-950/30 via-zinc-950 to-zinc-950 pointer-events-none"/>
      <div className="relative w-full max-w-md">
        <div className="text-center mb-10">
          <div className="w-20 h-20 bg-red-600 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-5 shadow-2xl shadow-red-900/50">⚽</div>
          <h1 className="text-3xl font-bold text-white tracking-tight">{APP_NAME}</h1>
          <p className="text-zinc-400 mt-2 text-sm">{TOURNAMENT_NAME}</p>
        </div>
        <div className="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl">
          <div className="flex border-b border-zinc-800">
            {[['login','Anmelden'],['register','Registrieren']].map(([v,l])=>(
              <button key={v} onClick={()=>setTab(v)} className={`flex-1 py-4 text-sm font-semibold transition-all ${tab===v?'text-red-400 border-b-2 border-red-500 bg-red-500/5':'text-zinc-500 hover:text-zinc-300'}`}>{l}</button>
            ))}
          </div>
          <form onSubmit={tab==='login'?login:register} className="p-6">
            {tab==='register'&&<>
              <Inp label="Vollständiger Name" value={name} onChange={e=>setName(e.target.value)} placeholder="Max Mustermann" required/>
              <div className="mb-4">
                <label className="block text-sm font-medium text-zinc-300 mb-1">Orgagruppe</label>
                <select value={groupId} onChange={e=>setGroupId(e.target.value)} required className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-red-500">
                  <option value="">Bitte wählen…</option>
                  {groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}
                </select>
                {groupId&&(()=>{const g=groups.find(x=>x.id===groupId);return g?<p className="text-xs text-zinc-500 mt-1.5">👤 {g.description}</p>:null;})()}
              </div>
            </>}
            <Inp label="E-Mail" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@beispiel.de" required/>
            <Inp label="Passwort" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" required minLength={6}/>
            {msg&&<p className="text-sm text-red-400 mb-4 bg-red-900/20 border border-red-900/40 rounded-lg px-3 py-2">{msg}</p>}
            <Btn variant="primary" size="lg" className="w-full" disabled={loading} type="submit">{loading?'⏳ Bitte warten…':tab==='login'?'Anmelden':'Konto erstellen'}</Btn>
          </form>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// ADMIN DASHBOARD
// ══════════════════════════════════════════════════════════════
function AdminDashboard({profile,setPage}) {
  const [stats,setStats]=useState({helpers:0,groups:0,tasks:0,avail:0,msgs:0});
  const [recentTasks,setRecentTasks]=useState([]);
  const [dayStats,setDayStats]=useState([]);

  useEffect(()=>{(async()=>{
    const [users,groups,tasks,avails,msgs]=await Promise.all([getDocs(col('users')),getDocs(col('groups')),getDocs(col('tasks')),getDocs(col('availability')),getDocs(col('messages').where('read','==',false))]);
    const userMap=Object.fromEntries(users.map(u=>[u.id,u]));
    setStats({helpers:users.filter(u=>u.role==='helper').length,groups:groups.length,tasks:tasks.length,avail:avails.length,msgs:msgs.length});
    setRecentTasks(sortBy(tasks,'created_at',true).slice(0,5).map(t=>({...t,profile:t.assigned_to?userMap[t.assigned_to]:null})));
    setDayStats(TOURNAMENT_DAYS.map(d=>({...d,count:avails.filter(a=>(a.days||[]).includes(d.id)).length})));
  })();},[]);

  const tiles=[
    {label:'Helfer',value:stats.helpers,icon:'👥',page:'helpers',color:'from-red-900/40 to-red-950/60',border:'border-red-900/40',accent:'text-red-400'},
    {label:'Orgagruppen',value:stats.groups,icon:'🏢',page:'groups',color:'from-zinc-800/60 to-zinc-900/60',border:'border-zinc-700/40',accent:'text-zinc-300'},
    {label:'Aufgaben',value:stats.tasks,icon:'✅',page:'grouptasks',color:'from-zinc-800/60 to-zinc-900/60',border:'border-zinc-700/40',accent:'text-zinc-300'},
    {label:'Verfügbarkeiten',value:stats.avail,icon:'📅',page:'availability',color:'from-zinc-800/60 to-zinc-900/60',border:'border-zinc-700/40',accent:'text-zinc-300'},
    {label:'Neue Nachrichten',value:stats.msgs,icon:'✉️',page:'messages',color:stats.msgs>0?'from-red-900/40 to-red-950/60':'from-zinc-800/60 to-zinc-900/60',border:stats.msgs>0?'border-red-900/40':'border-zinc-700/40',accent:stats.msgs>0?'text-red-400':'text-zinc-300'},
  ];

  return (
    <div>
      <div className="mb-8">
        <h1 className="text-3xl font-bold tracking-tight">Willkommen, {(profile.full_name||'').split(' ')[0]} 👋</h1>
        <p className="text-zinc-500 mt-1 text-sm">{TOURNAMENT_NAME} · Admin-Bereich</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-8">
        {tiles.map(t=>(
          <button key={t.label} onClick={()=>setPage(t.page)} className={`bg-gradient-to-br ${t.color} border ${t.border} rounded-2xl p-5 text-left card-hover group transition-all`}>
            <div className="text-2xl mb-3">{t.icon}</div>
            <div className={`text-3xl font-bold ${t.accent} mb-1`}>{t.value}</div>
            <div className="text-xs text-zinc-500 group-hover:text-zinc-400 transition-colors">{t.label}</div>
            <div className="text-xs text-zinc-600 mt-2 group-hover:text-red-500 transition-colors">→ Öffnen</div>
          </button>
        ))}
      </div>

      <div className="grid lg:grid-cols-2 gap-5">
        <Card className="p-5">
          <h2 className="font-semibold mb-5 flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full inline-block"/>Helfer pro Tag</h2>
          <div className="space-y-3">
            {dayStats.map(d=>(
              <div key={d.id} className="flex items-center gap-3">
                <div className="w-20 text-xs font-medium text-zinc-400">{d.label}</div>
                {d.note&&<span className="text-xs bg-red-900/30 text-red-400 border border-red-900/30 px-2 py-0.5 rounded-full">{d.note}</span>}
                <div className="flex-1 bg-zinc-800 rounded-full h-2"><div className="h-2 rounded-full bg-red-500 transition-all" style={{width:`${stats.helpers>0?Math.round((d.count/Math.max(stats.helpers,1))*100):0}%`}}/></div>
                <span className="text-sm font-bold text-zinc-300 w-6 text-right">{d.count}</span>
              </div>
            ))}
          </div>
        </Card>
        <Card className="p-5">
          <h2 className="font-semibold mb-5 flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full inline-block"/>Neueste Aufgaben</h2>
          {recentTasks.length===0?<p className="text-zinc-600 text-sm">Keine Aufgaben</p>:(
            <div className="space-y-3">
              {recentTasks.map(t=>(
                <div key={t.id} className="flex items-center justify-between py-2.5 border-b border-zinc-800 last:border-0">
                  <div><p className="text-sm font-medium">{t.title}</p><p className="text-xs text-zinc-600 mt-0.5">{t.profile?.full_name||'Nicht zugewiesen'}</p></div>
                  <Badge color={taskStatusColor[t.status]}>{taskStatusLabel[t.status]}</Badge>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// HELPER DASHBOARD
// ══════════════════════════════════════════════════════════════
function HelperDashboard({profile,setPage}) {
  const [myTasks,setMyTasks]=useState([]);
  const [myGroup,setMyGroup]=useState(null);
  const [myDays,setMyDays]=useState([]);
  const [unread,setUnread]=useState(0);

  useEffect(()=>{(async()=>{
    const uid=profile.id;
    const [tasks,membs,notifs,avail]=await Promise.all([getDocs(col('tasks').where('assigned_to','==',uid)),getDocs(col('memberships').where('user_id','==',uid)),getDocs(col('notifications').where('user_id','==',uid).where('read','==',false)),getDoc_(col('availability').doc(uid))]);
    setMyTasks(tasks.filter(t=>t.status!=='done'));setUnread(notifs.length);setMyDays(avail?.days||[]);
    if(membs.length>0){const g=await getDoc_(col('groups').doc(membs[0].group_id));setMyGroup(g);}
  })();},[profile]);

  return (
    <div>
      <div className="mb-8">
        <h1 className="text-3xl font-bold tracking-tight">Hallo, {(profile.full_name||'').split(' ')[0]} 👋</h1>
        <p className="text-zinc-500 mt-1 text-sm">{TOURNAMENT_NAME}</p>
      </div>

      {myGroup&&(
        <div className="rounded-2xl p-5 mb-6 relative overflow-hidden" style={{background:`linear-gradient(135deg, ${myGroup.color}30, ${myGroup.color}10)`,border:`1px solid ${myGroup.color}40`}}>
          <div className="flex items-center gap-4">
            <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl" style={{background:myGroup.color+'25'}}>{myGroup.icon}</div>
            <div><p className="font-bold text-lg">{myGroup.name}</p><p className="text-sm text-zinc-400">Verantwortliche: {myGroup.description}</p></div>
          </div>
        </div>
      )}

      {unread>0&&(
        <button onClick={()=>setPage('notifications')} className="w-full bg-red-900/20 border border-red-900/40 rounded-2xl p-4 mb-5 flex items-center gap-3 card-hover text-left">
          <div className="w-10 h-10 bg-red-500/20 rounded-xl flex items-center justify-center text-xl">🔔</div>
          <p className="font-medium text-red-300">{unread} neue Benachrichtigung{unread!==1?'en':''}</p>
          <span className="ml-auto text-red-500">→</span>
        </button>
      )}

      <div className="grid gap-4 md:grid-cols-2">
        <button onClick={()=>setPage('availability')} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-left card-hover group">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-semibold flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full inline-block"/>Meine Verfügbarkeit</h2>
            <span className="text-zinc-600 group-hover:text-red-500 transition-colors text-sm">→</span>
          </div>
          {myDays.length===0?<p className="text-zinc-600 text-sm">Noch keine Tage ausgewählt</p>:(
            <div className="flex flex-wrap gap-2">

// ADMIN — NACHRICHTEN
// ══════════════════════════════════════════════════════════════
function AdminNachrichten({show}) {
  const [messages,setMessages]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [reply,setReply]=useState('');
  const [sending,setSending]=useState(false);

  const load=async()=>{setLoading(true);const msgs=await getDocs(col('messages').orderBy('created_at','desc'));setMessages(msgs);setLoading(false);};
  useEffect(()=>{load();},[]);

  const open=async(msg)=>{setSelected(msg);setReply('');if(!msg.read)await col('messages').doc(msg.id).update({read:true});setMessages(m=>m.map(x=>x.id===msg.id?{...x,read:true}:x));};
  const sendReply=async()=>{if(!reply.trim()||!selected)return;setSending(true);await col('notifications').add({user_id:selected.from_user_id,title:`Antwort: ${selected.subject}`,message:reply,type:'info',read:false,created_at:ts()});await col('messages').doc(selected.id).update({replied:true});setMessages(m=>m.map(x=>x.id===selected.id?{...x,replied:true}:x));setSelected(s=>({...s,replied:true}));show('Antwort gesendet ✅');setReply('');setSending(false);};
  const del=async(id)=>{await col('messages').doc(id).delete();load();setSelected(null);show('Nachricht gelöscht');};
  const unreadCount=messages.filter(m=>!m.read).length;

  return (
    <div>
      <h1 className="text-2xl font-bold mb-2">✉️ Nachrichten {unreadCount>0&&<span className="ml-2 text-sm font-normal bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded-full">{unreadCount} ungelesen</span>}</h1>
      <p className="text-zinc-500 text-sm mb-5">Nachrichten der Helfer an dich.</p>
      {loading?<Spinner/>:messages.length===0?<Card className="p-10 text-center text-zinc-600">Noch keine Nachrichten</Card>:(
        <div className="grid md:grid-cols-2 gap-4">
          <div className="space-y-2">
            {messages.map(m=>(
              <button key={m.id} onClick={()=>open(m)} className={`w-full bg-zinc-900 border rounded-2xl p-4 text-left transition-all hover:border-red-900/50 ${selected?.id===m.id?'border-red-600/50 glow':'border-zinc-800'} ${!m.read?'border-l-2 border-l-red-500':''}`}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0"><p className={`text-sm truncate ${!m.read?'font-semibold text-white':'text-zinc-300'}`}>{m.subject||'(Kein Betreff)'}</p><p className="text-xs text-zinc-500 mt-0.5">von {m.from_name}</p></div>
                  <div className="flex gap-1 flex-shrink-0 mt-0.5">{!m.read&&<div className="w-2 h-2 rounded-full bg-red-500"/>}{m.replied&&<Badge color="green">✓</Badge>}</div>
                </div>
                <p className="text-xs text-zinc-600 mt-2 line-clamp-1">{m.message}</p>
              </button>
            ))}
          </div>
          {selected?(
            <Card className="p-5">
              <div className="flex items-start justify-between mb-4">
                <div><h3 className="font-semibold">{selected.subject||'(Kein Betreff)'}</h3><p className="text-xs text-zinc-500">von {selected.from_name}</p></div>
                <Btn variant="danger" size="sm" onClick={()=>del(selected.id)}>🗑️</Btn>
              </div>
              <div className="bg-zinc-800 rounded-xl p-4 mb-4 text-sm text-zinc-300 leading-relaxed">{selected.message}</div>
              <Txt value={reply} onChange={e=>setReply(e.target.value)} placeholder="Deine Antwort…" rows={4}/>
              <Btn onClick={sendReply} disabled={!reply.trim()||sending}>{sending?'⏳ Sende…':'📤 Antwort senden'}</Btn>
              <p className="text-xs text-zinc-600 mt-2">Antwort geht als Benachrichtigung an den Helfer.</p>
            </Card>
          ):<div className="bg-zinc-900/50 border border-dashed border-zinc-800 rounded-2xl p-10 text-center text-zinc-600">Nachricht auswählen</div>}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
function AdminVerfügbarkeit() {
  const [avails,setAvails]=useState([]);
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [loading,setLoading]=useState(true);
  const [activeDay,setActiveDay]=useState('12.08.2027');

  useEffect(()=>{(async()=>{const [a,u,g,m]=await Promise.all([getDocs(col('availability')),getDocs(col('users')),getDocs(col('groups')),getDocs(col('memberships'))]);setAvails(a);setUsers(u);setGroups(g);setMemberships(m);setLoading(false);})();},[]);

  const userMap=Object.fromEntries(users.map(u=>[u.id,u]));
  const groupMap=Object.fromEntries(groups.map(g=>[g.id,g]));
  const getUserGroup=(uid)=>{const m=memberships.find(x=>x.user_id===uid);return m?groupMap[m.group_id]:null;};
  const helpersForDay=(dayId)=>avails.filter(a=>(a.days||[]).includes(dayId)).map(a=>({...userMap[a.user_id],uid:a.user_id})).filter(u=>u&&u.full_name);
  const day=TOURNAMENT_DAYS.find(d=>d.id===activeDay);
  const helpers=helpersForDay(activeDay);
  const byGroup={};
  helpers.forEach(h=>{const g=getUserGroup(h.uid||h.id);const key=g?g.id:'_none';if(!byGroup[key])byGroup[key]={group:g,helpers:[]};byGroup[key].helpers.push(h);});

  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">📅 Verfügbarkeit</h1>
      <div className="flex gap-2 mb-6 flex-wrap">
        {TOURNAMENT_DAYS.map(d=>(
          <button key={d.id} onClick={()=>setActiveDay(d.id)} className={`px-4 py-2 rounded-xl text-sm font-medium transition-all border ${activeDay===d.id?'bg-red-600 text-white border-red-600 shadow-lg shadow-red-900/30':'bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-700'}`}>
            {d.label}{d.note&&<span className={`ml-1.5 text-xs ${activeDay===d.id?'text-red-200':'text-zinc-600'}`}>{d.note}</span>}
          </button>
        ))}
      </div>
      {loading?<Spinner/>:(
        <div>
          <div className="flex items-center gap-3 mb-4">
            <h2 className="text-lg font-semibold">{day?.label}</h2>
            <span className="bg-red-900/30 text-red-400 border border-red-900/40 px-3 py-1 rounded-full text-sm">{helpers.length} Helfer</span>
          </div>
          {helpers.length===0?<Card className="p-8 text-center text-zinc-600">Noch keine Helfer für diesen Tag</Card>:(
            <div className="space-y-3">
              {Object.values(byGroup).map((entry,i)=>(
                <Card key={i} className="overflow-hidden">
                  <div className="px-4 py-3 border-b border-zinc-800 flex items-center gap-2" style={{background:entry.group?entry.group.color+'12':'transparent'}}>
                    <span className="text-lg">{entry.group?.icon||'👤'}</span>
                    <span className="font-semibold" style={{color:entry.group?.color||'#a1a1aa'}}>{entry.group?.name||'Ohne Gruppe'}</span>
                    <span className="ml-auto text-xs text-zinc-600">{entry.helpers.length} Helfer</span>
                  </div>
                  <div className="divide-y divide-zinc-800/50">
                    {entry.helpers.map((h,j)=>(
                      <div key={j} className="flex items-center gap-3 px-4 py-2.5">
                        <Avatar name={h.full_name} color={h.avatar_color} size="sm"/>
                        <span className="text-sm">{h.full_name}</span>
                      </div>
                    ))}
                  </div>
                </Card>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const load=async()=>{setLoading(true);const [t,u,g]=await Promise.all([getDocs(col('tasks')),getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name'))]);const uMap=Object.fromEntries(u.map(x=>[x.id,x]));const gMap=Object.fromEntries(g.map(x=>[x.id,x]));setTasks(sortBy(t,'created_at',true).map(x=>({...x,profile:x.assigned_to?uMap[x.assigned_to]:null,group:x.group_id?gMap[x.group_id]:null})));setUsers(u);setGroups(g);setLoading(false);};

  const save=async()=>{if(!form.title.trim())return;const uid=auth.currentUser?.uid;const data={...form,group_id:form.group_id||null,assigned_to:form.assigned_to||null};if(editing)await col('tasks').doc(editing.id).update(data);else await col('tasks').add({...data,created_by:uid,created_at:ts()});load();setShowForm(false);show(editing?'Aktualisiert':'Erstellt');};
  const del=async(t)=>{if(!confirm(`"${t.title}" löschen?`))return;await col('tasks').doc(t.id).delete();load();show('Gelöscht');};

  const tasksForGroup=(gid)=>tasks.filter(t=>t.group_id===gid);
  const tasksNoGroup=tasks.filter(t=>!t.group_id);
  const filtered=(groupFilter==='none'?tasksNoGroup:groupFilter?tasks.filter(t=>t.group_id===groupFilter):tasks).filter(t=>filter==='all'||t.status===filter);
  const activeGroup=groupFilter?groups.find(g=>g.id===groupFilter):null;

  return (
    <div>
      <div className="flex items-center justify-between mb-5"><h1 className="text-2xl font-bold">✅ Aufgaben</h1><Btn onClick={()=>{setEditing(null);setForm({title:'',description:'',group_id:'',assigned_to:'',priority:'normal',status:'open',location:''});setShowForm(true);}}>+ Neue Aufgabe</Btn></div>

      {/* Gruppen-Kacheln */}
      {loading?<Spinner/>:<>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <button onClick={()=>setGroupFilter(null)} className={`rounded-2xl p-4 text-left border transition-all card-hover ${groupFilter===null?'border-red-500 bg-red-900/20 glow':'border-zinc-800 bg-zinc-900 hover:border-zinc-700'}`}>
          <div className="text-xl mb-2">📋</div>
          <div className={`text-2xl font-bold mb-0.5 ${groupFilter===null?'text-red-300':'text-white'}`}>{tasks.length}</div>
          <div className="text-xs text-zinc-500">Alle Aufgaben</div>
        </button>
        <button onClick={()=>setGroupFilter('none')} className={`rounded-2xl p-4 text-left border transition-all card-hover ${groupFilter==='none'?'border-red-500 bg-red-900/20 glow':'border-zinc-800 bg-zinc-900 hover:border-zinc-700'}`}>
          <div className="text-xl mb-2">🔓</div>
          <div className={`text-2xl font-bold mb-0.5 ${groupFilter==='none'?'text-red-300':'text-white'}`}>{tasksNoGroup.length}</div>
          <div className="text-xs text-zinc-500">Ohne Gruppe</div>
        </button>
        {groups.map(g=>{const cnt=tasksForGroup(g.id).length;return(
          <button key={g.id} onClick={()=>setGroupFilter(g.id)} className={`rounded-2xl p-4 text-left border transition-all card-hover ${groupFilter===g.id?'border-red-500 glow':'border-zinc-800 bg-zinc-900 hover:border-zinc-700'}`} style={groupFilter===g.id?{background:g.color+'18'}:{}}>
            <div className="text-xl mb-2">{g.icon}</div>
            <div className="text-2xl font-bold mb-0.5" style={{color:groupFilter===g.id?g.color:'white'}}>{cnt}</div>
            <div className="text-xs text-zinc-500 truncate">{g.name}</div>
          </button>
        );})}
      </div>

      {/* Aktive Gruppe Header */}
      {activeGroup&&<div className="flex items-center gap-2 mb-4 px-4 py-2.5 rounded-xl border" style={{background:activeGroup.color+'12',borderColor:activeGroup.color+'30'}}>
        <span className="text-lg">{activeGroup.icon}</span>
        <span className="font-semibold" style={{color:activeGroup.color}}>{activeGroup.name}</span>
        <button onClick={()=>setGroupFilter(null)} className="ml-auto text-xs text-zinc-600 hover:text-zinc-400">✕ Alle anzeigen</button>
      </div>}

      <div className="flex gap-2 mb-4 flex-wrap">
        {[['all','Alle'],['open','Offen'],['in_progress','In Arbeit'],['done','Erledigt']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} className={`px-3 py-1.5 rounded-xl text-sm font-medium transition-all ${filter===v?'bg-red-600 text-white':'bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700'}`}>{l}</button>
        ))}
      </div>
      {loading?<Spinner/>:(
        <Card>
          <table className="w-full text-sm">
            <thead className="border-b border-zinc-800"><tr>
              <th className="text-left px-4 py-3 font-medium text-zinc-500 text-xs uppercase tracking-wider">Aufgabe</th>
              <th className="text-left px-4 py-3 font-medium text-zinc-500 text-xs uppercase tracking-wider hidden md:table-cell">Gruppe</th>
              <th className="text-left px-4 py-3 font-medium text-zinc-500 text-xs uppercase tracking-wider hidden md:table-cell">Zugewiesen</th>
              <th className="text-left px-4 py-3 font-medium text-zinc-500 text-xs uppercase tracking-wider">Status</th>
              <th className="px-4 py-3"/>
            </tr></thead>
            <tbody>
              {filtered.map(t=>(
                <tr key={t.id} className="border-b border-zinc-800/50 last:border-0 hover:bg-zinc-800/20 transition-colors">
                  <td className="px-4 py-3"><p className="font-medium">{t.title}</p><Badge color={priorityColor[t.priority]}>{priorityLabel[t.priority]}</Badge></td>
                  <td className="px-4 py-3 hidden md:table-cell">{t.group?<span className="text-xs px-2 py-0.5 rounded-full text-white font-medium" style={{background:t.group.color}}>{t.group.icon} {t.group.name}</span>:<span className="text-zinc-700">—</span>}</td>
                  <td className="px-4 py-3 hidden md:table-cell">{t.profile?<div className="flex items-center gap-2"><Avatar name={t.profile.full_name} color={t.profile.avatar_color} size="sm"/><span className="text-zinc-300">{t.profile.full_name}</span></div>:<span className="text-zinc-700">—</span>}</td>
                  <td className="px-4 py-3"><Badge color={taskStatusColor[t.status]}>{taskStatusLabel[t.status]}</Badge></td>
                  <td className="px-4 py-3 text-right"><div className="flex gap-1 justify-end">
                    <Btn variant="ghost" size="sm" onClick={()=>{setEditing(t);setForm({title:t.title,description:t.description||'',group_id:t.group_id||'',assigned_to:t.assigned_to||'',priority:t.priority,status:t.status,location:t.location||''});setShowForm(true);}}>✏️</Btn>
                    <Btn variant="danger" size="sm" onClick={()=>del(t)}>🗑️</Btn>
                  </div></td>
                </tr>
              ))}
              {filtered.length===0&&<tr><td colSpan={5} className="px-4 py-8 text-center text-zinc-600">Keine Aufgaben</td></tr>}
            </tbody>
          </table>
        </Card>
      )}
      {showForm&&(
        <Modal title={editing?'Bearbeiten':'Neue Aufgabe'} onClose={()=>setShowForm(false)} wide>
          <div className="grid grid-cols-2 gap-x-4">
            <div className="col-span-2"><Inp label="Titel" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} required/></div>
            <div className="col-span-2"><Txt label="Beschreibung" value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div>
            <Sel label="Gruppe" value={form.group_id} onChange={e=>setForm({...form,group_id:e.target.value})}><option value="">Keine Gruppe</option>{groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}</Sel>
            <Sel label="Zugewiesen an" value={form.assigned_to} onChange={e=>setForm({...form,assigned_to:e.target.value})}><option value="">Nicht zugewiesen</option>{users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}</Sel>
            <Sel label="Priorität" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option value="low">Niedrig</option><option value="normal">Normal</option><option value="high">Hoch</option></Sel>
            <Sel label="Status" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}><option value="open">Offen</option><option value="in_progress">In Arbeit</option><option value="done">Erledigt</option></Sel>
            <div className="col-span-2"><Inp label="Ort / Station" value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="z.B. Eingang Nord"/></div>
          </div>
          <div className="flex justify-end gap-3"><Btn variant="secondary" onClick={()=>setShowForm(false)}>Abbrechen</Btn><Btn onClick={save} disabled={!form.title.trim()}>{editing?'Speichern':'Erstellen'}</Btn></div>
        </Modal>
      )}
    </div>
  );
}

// ADMIN — BENACHRICHTIGUNGEN SENDEN
// ══════════════════════════════════════════════════════════════
function AdminNotifications({show}) {
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [form,setForm]=useState({title:'',message:'',type:'info',target:'all',group_id:'',user_id:''});
  const [sending,setSending]=useState(false);
  useEffect(()=>{(async()=>{const [u,g,m]=await Promise.all([getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name')),getDocs(col('memberships'))]);setUsers(u);setGroups(g);setMemberships(m);})();},[]);
  const send=async()=>{
    if(!form.title.trim()||!form.message.trim())return;setSending(true);
    let r=[];
    if(form.target==='all')r=users.map(u=>u.id);
    else if(form.target==='group')r=memberships.filter(m=>m.group_id===form.group_id).map(m=>m.user_id);
    else if(form.target==='single'&&form.user_id)r=[form.user_id];
    if(r.length===0){show('Keine Empfänger','error');setSending(false);return;}
    const batch=db.batch();r.forEach(uid=>{const ref=col('notifications').doc();batch.set(ref,{user_id:uid,title:form.title,message:form.message,type:form.type,read:false,created_at:ts()});});
    await batch.commit();show(`Gesendet an ${r.length} Person(en)`);setForm({title:'',message:'',type:'info',target:'all',group_id:'',user_id:''});setSending(false);
  };
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">🔔 Benachrichtigungen senden</h1>
      <Card className="p-5 max-w-2xl">
        <Inp label="Titel" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="z.B. Wichtige Information"/>
        <Txt label="Nachricht" value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Deine Nachricht…"/>
        <div className="grid grid-cols-2 gap-4">
          <Sel label="Typ" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}><option value="info">ℹ️ Info</option><option value="success">✅ Erfolg</option><option value="warning">⚠️ Warnung</option><option value="error">❌ Dringend</option></Sel>
          <Sel label="Empfänger" value={form.target} onChange={e=>setForm({...form,target:e.target.value,group_id:'',user_id:''})}><option value="all">Alle Helfer</option><option value="group">Gruppe</option><option value="single">Einzelne Person</option></Sel>
        </div>
        {form.target==='group'&&<Sel label="Gruppe" value={form.group_id} onChange={e=>setForm({...form,group_id:e.target.value})}><option value="">Gruppe wählen…</option>{groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}</Sel>}
        {form.target==='single'&&<Sel label="Person" value={form.user_id} onChange={e=>setForm({...form,user_id:e.target.value})}><option value="">Person wählen…</option>{users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}</Sel>}
        <div className="flex justify-end"><Btn onClick={send} disabled={sending||!form.title.trim()||!form.message.trim()}>{sending?'⏳ Sende…':'📤 Senden'}</Btn></div>
      </Card>
    </div>
  );
}

// HELFER — VERFÜGBARKEIT
// ══════════════════════════════════════════════════════════════
function HelperVerfügbarkeit({profile,show}) {
  const [selectedDays,setSelectedDays]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{(async()=>{const a=await getDoc_(col('availability').doc(profile.id));setSelectedDays(a?.days||[]);setLoading(false);})();},[profile]);

  const toggle=async(dayId)=>{
    const nd=selectedDays.includes(dayId)?selectedDays.filter(d=>d!==dayId):[...selectedDays,dayId];
    setSelectedDays(nd);setSaving(true);
    await col('availability').doc(profile.id).set({user_id:profile.id,days:nd,updated_at:ts()},{merge:true});
    setSaving(false);
  };

  if(loading)return <Spinner/>;
  return (
    <div>
      <h1 className="text-2xl font-bold mb-2">📅 Meine Verfügbarkeit</h1>
      <p className="text-zinc-500 mb-6 text-sm">Klicke auf die Tage, an denen du helfen kannst. {saving&&<span className="text-red-400">⏳ Wird gespeichert…</span>}</p>
      <div className="grid gap-3 grid-cols-2 md:grid-cols-5">
        {TOURNAMENT_DAYS.map(d=>{
          const sel=selectedDays.includes(d.id);
          return (
            <button key={d.id} onClick={()=>toggle(d.id)} className={`p-5 rounded-2xl border-2 text-center transition-all ${sel?'border-red-500 bg-red-900/20 glow':'border-zinc-800 bg-zinc-900 hover:border-zinc-700'}`}>
              <div className={`text-3xl mb-3 transition-all ${sel?'':'grayscale opacity-30'}`}>{d.id==='12.08.2027'?'🔧':d.id==='16.08.2027'?'📦':'⚽'}</div>
              <div className={`font-bold text-sm ${sel?'text-red-300':'text-zinc-500'}`}>{d.label}</div>
              {d.note&&<div className={`text-xs mt-1 ${sel?'text-red-400':'text-zinc-600'}`}>{d.note}</div>}
              <div className={`mt-3 w-7 h-7 rounded-full border-2 mx-auto flex items-center justify-center transition-all ${sel?'bg-red-500 border-red-500':'border-zinc-700'}`}>{sel&&<span className="text-xs text-white font-bold">✓</span>}</div>
            </button>
          );
        })}
      </div>
      <Card className="mt-5 p-5">
        <h3 className="font-semibold mb-3 text-sm text-zinc-400 uppercase tracking-wider">Deine Auswahl</h3>
        {selectedDays.length===0?<p className="text-zinc-600 text-sm">Noch keine Tage ausgewählt</p>:(
          <div className="flex flex-wrap gap-2">{TOURNAMENT_DAYS.filter(d=>selectedDays.includes(d.id)).map(d=><span key={d.id} className="bg-red-900/30 text-red-300 border border-red-900/40 px-4 py-1.5 rounded-xl text-sm font-medium">{d.label}{d.note?` (${d.note})`:''}</span>)}</div>
        )}
        <p className="text-xs text-zinc-700 mt-3">Wird automatisch gespeichert.</p>
      </Card>
    </div>
  );
}

// HELFER — AUFGABEN (zwei Kacheln)
// ══════════════════════════════════════════════════════════════
function HelperTasks({profile,show,defaultTab='group'}) {
  const [myTasks,setMyTasks]=useState([]);
  const [groupTasks,setGroupTasks]=useState([]);
  const [myGroup,setMyGroup]=useState(null);
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState(defaultTab); // 'mine' | 'group'

  const load=async()=>{
    setLoading(true);
    const [allT,groups,memberships]=await Promise.all([getDocs(col('tasks')),getDocs(col('groups')),getDocs(col('memberships').where('user_id','==',profile.id))]);
    const gMap=Object.fromEntries(groups.map(x=>[x.id,x]));
    const myMem=memberships[0];
    const myGid=myMem?myMem.group_id:null;
    const grp=myGid?gMap[myGid]:null;
    setMyGroup(grp);
    const enriched=sortBy(allT,'created_at',true).map(x=>({...x,group:x.group_id?gMap[x.group_id]:null}));
    setMyTasks(enriched.filter(t=>t.assigned_to===profile.id));
    setGroupTasks(myGid?enriched.filter(t=>t.group_id===myGid):[]);
    setLoading(false);
  };
  useEffect(()=>{load();},[profile]);
  const updateStatus=async(id,status)=>{await col('tasks').doc(id).update({status});load();show('Status aktualisiert');};

  const TaskList=({tasks,emptyMsg})=>(
    <div className="space-y-3 mt-5">
      {tasks.map(t=>(
        <Card key={t.id} className="p-5">
          <div className="flex items-start justify-between">
            <div className="flex-1">
              <div className="flex items-center gap-2 flex-wrap mb-1">
                <h3 className="font-semibold">{t.title}</h3>
                <Badge color={priorityColor[t.priority]}>{priorityLabel[t.priority]}</Badge>
                {t.group&&<span className="text-xs px-2 py-0.5 rounded-full text-white font-medium" style={{background:t.group.color}}>{t.group.icon} {t.group.name}</span>}
              </div>
              {t.description&&<p className="text-sm text-zinc-500 mb-2">{t.description}</p>}
              {t.location&&<p className="text-xs text-zinc-600">📍 {t.location}</p>}
            </div>
            <div className="ml-4">
              <Sel value={t.status} onChange={e=>updateStatus(t.id,e.target.value)}>
                <option value="open">Offen</option>
                <option value="in_progress">In Arbeit</option>
                <option value="done">Erledigt</option>
              </Sel>
            </div>
          </div>
        </Card>
      ))}
      {tasks.length===0&&<div className="bg-zinc-900/50 border border-dashed border-zinc-800 rounded-2xl p-8 text-center text-zinc-600 text-sm">{emptyMsg}</div>}
    </div>
  );

  return (
    <div>
      <h1 className="text-2xl font-bold mb-6">✅ Aufgaben</h1>

      {/* Zwei Kacheln */}
      <div className="grid grid-cols-2 gap-4 mb-6">
        <button onClick={()=>setView('mine')} className={`rounded-2xl p-5 text-left border-2 transition-all card-hover ${view==='mine'?'border-red-500 bg-red-900/15 glow':'border-zinc-800 bg-zinc-900 hover:border-zinc-700'}`}>
          <div className="text-3xl mb-3">👤</div>
          <div className={`text-4xl font-bold mb-1 ${view==='mine'?'text-red-300':'text-white'}`}>{myTasks.length}</div>
          <div className="font-semibold text-sm mb-0.5">Meine Aufgaben</div>
          <div className="text-xs text-zinc-600">Dir persönlich zugewiesen</div>
          <div className={`mt-3 text-xs font-medium ${view==='mine'?'text-red-400':'text-zinc-600'}`}>{view==='mine'?'▶ Aktive Ansicht':'→ Anzeigen'}</div>
        </button>

        <button onClick={()=>setView('group')} className={`rounded-2xl p-5 text-left border-2 transition-all card-hover ${view==='group'?'border-red-500 glow':'border-zinc-800 bg-zinc-900 hover:border-zinc-700'}`}
          style={view==='group'&&myGroup?{background:myGroup.color+'18',borderColor:myGroup.color+'80'}:{}}>
          <div className="text-3xl mb-3">{myGroup?myGroup.icon:'🏢'}</div>
          <div className="text-4xl font-bold mb-1" style={{color:view==='group'&&myGroup?myGroup.color:'white'}}>{groupTasks.length}</div>
          <div className="font-semibold text-sm mb-0.5">Orgagruppen-Aufgaben</div>
          <div className="text-xs text-zinc-600">{myGroup?myGroup.name:'Alle Aufgaben der Gruppe'}</div>
          <div className={`mt-3 text-xs font-medium ${view==='group'?'text-red-400':'text-zinc-600'}`}>{view==='group'?'▶ Aktive Ansicht':'→ Anzeigen'}</div>
        </button>
      </div>

      {/* Aufgabenliste */}
      {loading?<Spinner/>:view==='mine'?(
        <TaskList tasks={myTasks} emptyMsg="Dir sind keine Aufgaben zugewiesen."/>
      ):(
        <TaskList tasks={groupTasks} emptyMsg={myGroup?`Keine Aufgaben für ${myGroup.name}.`:"Du bist noch keiner Gruppe zugeordnet."}/>
      )}
    </div>
  );
}

// HELFER — NACHRICHT AN ADMIN
// ══════════════════════════════════════════════════════════════
function HelperNachricht({profile,show}) {
  const [form,setForm]=useState({subject:'',message:''});
  const [sending,setSending]=useState(false);
  const [myMessages,setMyMessages]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=async()=>{setLoading(true);const msgs=await getDocs(col('messages').where('from_user_id','==',profile.id).orderBy('created_at','desc'));setMyMessages(msgs);setLoading(false);};
  useEffect(()=>{load();},[profile]);

  const send=async()=>{
    if(!form.subject.trim()||!form.message.trim())return;setSending(true);
    await col('messages').add({from_user_id:profile.id,from_name:profile.full_name,subject:form.subject,message:form.message,read:false,replied:false,created_at:ts()});
    show('Nachricht gesendet 📤');setForm({subject:'',message:''});setSending(false);load();
  };

  return (
    <div>
      <h1 className="text-2xl font-bold mb-2">✉️ Nachricht an Admin</h1>
      <p className="text-zinc-500 text-sm mb-6">Schreib direkt an das Organisationsteam.</p>
      <div className="grid md:grid-cols-2 gap-5">
        <Card className="p-5">
          <h2 className="font-semibold mb-4 flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full"/>Neue Nachricht</h2>
          <Inp label="Betreff" value={form.subject} onChange={e=>setForm({...form,subject:e.target.value})} placeholder="z.B. Frage zur Unterkunft"/>
          <div className="mb-4"><label className="block text-sm font-medium text-zinc-300 mb-1">Nachricht</label><textarea value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Deine Nachricht…" className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-red-500 resize-none" rows={6}/></div>
          <Btn onClick={send} disabled={sending||!form.subject.trim()||!form.message.trim()} className="w-full">{sending?'⏳ Wird gesendet…':'📤 Nachricht senden'}</Btn>
        </Card>
        <div>
          <h2 className="font-semibold mb-4 text-zinc-400">Gesendete Nachrichten</h2>
          {loading?<Spinner/>:myMessages.length===0?<div className="bg-zinc-900/50 border border-dashed border-zinc-800 rounded-2xl p-8 text-center text-zinc-600 text-sm">Noch keine Nachrichten</div>:(
            <div className="space-y-3">
              {myMessages.map(m=>(
                <Card key={m.id} className="p-4">
                  <div className="flex items-start justify-between"><p className="text-sm font-medium">{m.subject}</p>{m.replied?<Badge color="green">✓ Beantwortet</Badge>:<Badge color="gray">Ausstehend</Badge>}</div>
                  <p className="text-xs text-zinc-600 mt-2 line-clamp-2">{m.message}</p>
                  {m.replied&&<p className="text-xs text-red-400 mt-1.5">→ Antwort als Benachrichtigung erhalten</p>}
                </Card>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// BENACHRICHTIGUNGEN
// ══════════════════════════════════════════════════════════════
function NotificationsPage({profile}) {
  const [notifs,setNotifs]=useState([]);
  const [loading,setLoading]=useState(true);
  const load=async()=>{setLoading(true);const n=await getDocs(col('notifications').where('user_id','==',profile.id));setNotifs(sortBy(n,'created_at',true));setLoading(false);};
  useEffect(()=>{load();},[profile]);
  const markRead=async(id)=>{await col('notifications').doc(id).update({read:true});setNotifs(n=>n.map(x=>x.id===id?{...x,read:true}:x));};
  const markAll=async()=>{const batch=db.batch();notifs.filter(n=>!n.read).forEach(n=>batch.update(col('notifications').doc(n.id),{read:true}));await batch.commit();setNotifs(n=>n.map(x=>({...x,read:true})));};
  const typeIcon={info:'ℹ️',success:'✅',warning:'⚠️',error:'❌'};
  const typeBg={info:'border-blue-900/40',success:'border-green-900/40',warning:'border-yellow-900/40',error:'border-red-900/40'};
  const unread=notifs.filter(n=>!n.read).length;
  return (
    <div>
      <div className="flex items-center justify-between mb-5"><h1 className="text-2xl font-bold">🔔 Benachrichtigungen {unread>0&&<span className="ml-2 text-sm font-normal bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded-full">{unread} neu</span>}</h1>{unread>0&&<Btn variant="secondary" size="sm" onClick={markAll}>Alle gelesen</Btn>}</div>
      {loading?<Spinner/>:<div className="space-y-2">
        {notifs.map(n=>(
          <div key={n.id} onClick={()=>!n.read&&markRead(n.id)} className={`bg-zinc-900 border ${typeBg[n.type]||'border-zinc-800'} rounded-2xl p-4 cursor-pointer hover:bg-zinc-800/50 transition-all`}>
            <div className="flex items-start gap-3"><span className="text-xl">{typeIcon[n.type]||'ℹ️'}</span><div className="flex-1"><p className={`text-sm ${!n.read?'font-semibold text-white':'text-zinc-300'}`}>{n.title}</p><p className="text-sm text-zinc-500 mt-0.5">{n.message}</p></div>{!n.read&&<div className="w-2 h-2 rounded-full bg-red-500 mt-1.5"/>}</div>
          </div>
        ))}
        {notifs.length===0&&<p className="text-zinc-600 text-sm">Keine Benachrichtigungen</p>}
      </div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// PROFIL
// ══════════════════════════════════════════════════════════════
function HelperProfile({profile,show,onUpdate}) {
  const [form,setForm]=useState({full_name:profile.full_name||'',phone:profile.phone||''});
  const [newEmail,setNewEmail]=useState(auth.currentUser?.email||'');
  const [currentPw,setCurrentPw]=useState('');
  const [newPw,setNewPw]=useState('');
  const [myGroup,setMyGroup]=useState(null);
  const [savingProfile,setSavingProfile]=useState(false);
  const [savingEmail,setSavingEmail]=useState(false);
  const [savingPw,setSavingPw]=useState(false);

  useEffect(()=>{(async()=>{const m=await getDocs(col('memberships').where('user_id','==',profile.id));if(m.length>0){const g=await getDoc_(col('groups').doc(m[0].group_id));setMyGroup(g);}})();},[profile]);

  const saveProfile=async()=>{setSavingProfile(true);await col('users').doc(profile.id).update(form);onUpdate({...profile,...form});show('Profil gespeichert ✅');setSavingProfile(false);};
  const changeEmail=async()=>{if(!newEmail.trim()||!currentPw){show('Bitte aktuelles Passwort eingeben','error');return;}setSavingEmail(true);try{const cred=firebase.auth.EmailAuthProvider.credential(auth.currentUser.email,currentPw);await auth.currentUser.reauthenticateWithCredential(cred);await auth.currentUser.updateEmail(newEmail);await col('users').doc(profile.id).update({email:newEmail});onUpdate({...profile,email:newEmail});show('E-Mail aktualisiert ✅');setCurrentPw('');}catch(e){show(e.message,'error');}setSavingEmail(false);};
  const changePw=async()=>{if(newPw.length<6){show('Mindestens 6 Zeichen','error');return;}if(!currentPw){show('Bitte aktuelles Passwort eingeben','error');return;}setSavingPw(true);try{const cred=firebase.auth.EmailAuthProvider.credential(auth.currentUser.email,currentPw);await auth.currentUser.reauthenticateWithCredential(cred);await auth.currentUser.updatePassword(newPw);show('Passwort geändert ✅');setCurrentPw('');setNewPw('');}catch(e){show(e.message,'error');}setSavingPw(false);};

  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">👤 Mein Profil</h1>
      {myGroup&&<div className="rounded-2xl p-4 mb-6 flex items-center gap-4" style={{background:`linear-gradient(135deg, ${myGroup.color}25, ${myGroup.color}10)`,border:`1px solid ${myGroup.color}30`}}><div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl" style={{background:myGroup.color+'20'}}>{myGroup.icon}</div><div><p className="font-bold">{myGroup.name}</p><p className="text-sm text-zinc-400">{myGroup.description}</p></div></div>}
      <div className="grid md:grid-cols-2 gap-5">
        <Card className="p-5"><h2 className="font-semibold mb-4 flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full"/>Persönliche Daten</h2><div className="flex items-center gap-4 mb-5"><Avatar name={profile.full_name} color={profile.avatar_color} size="lg"/><div><p className="font-bold">{profile.full_name}</p><Badge color={profile.role==='admin'?'purple':'gray'}>{profile.role==='admin'?'Admin':'Helfer'}</Badge></div></div><Inp label="Name" value={form.full_name} onChange={e=>setForm({...form,full_name:e.target.value})}/><Inp label="Telefon" type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+49 …"/><Btn onClick={saveProfile} disabled={savingProfile}>{savingProfile?'⏳…':'Speichern'}</Btn></Card>
        <Card className="p-5"><h2 className="font-semibold mb-4 flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full"/>E-Mail ändern</h2><p className="text-xs text-zinc-600 mb-4">Aktuell: <span className="text-zinc-400">{auth.currentUser?.email}</span></p><Inp label="Neue E-Mail" type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)}/><Inp label="Passwort zur Bestätigung" type="password" value={currentPw} onChange={e=>setCurrentPw(e.target.value)} placeholder="••••••••"/><Btn onClick={changeEmail} disabled={savingEmail||!newEmail||!currentPw}>{savingEmail?'⏳…':'E-Mail ändern'}</Btn></Card>
        <Card className="p-5 md:col-span-2 md:max-w-md"><h2 className="font-semibold mb-4 flex items-center gap-2"><span className="w-1 h-4 bg-red-500 rounded-full"/>Passwort ändern</h2><Inp label="Aktuelles Passwort" type="password" value={currentPw} onChange={e=>setCurrentPw(e.target.value)} placeholder="••••••••"/><Inp label="Neues Passwort" type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="Mind. 6 Zeichen"/><Btn onClick={changePw} disabled={savingPw||newPw.length<6||!currentPw}>{savingPw?'⏳…':'Passwort ändern'}</Btn></Card>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════════════════════
function Sidebar({nav,active,setActive,profile,unread,msgCount,onLogout,mobileOpen,setMobileOpen}) {
  return (
    <>
      {mobileOpen&&<div className="fixed inset-0 z-20 bg-black/70 backdrop-blur-sm md:hidden" onClick={()=>setMobileOpen(false)}/>}
      <aside className={`fixed md:static inset-y-0 left-0 z-30 w-64 flex-shrink-0 bg-black border-r border-zinc-900 text-white flex flex-col transition-transform duration-200 ${mobileOpen?'translate-x-0':'-translate-x-full md:translate-x-0'}`}>
        <div className="p-5 border-b border-zinc-900">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-red-900/50">⚽</div>
            <div><p className="font-bold text-sm tracking-tight">{APP_NAME}</p><p className="text-zinc-600 text-xs truncate max-w-[140px]">{TOURNAMENT_NAME}</p></div>
          </div>
        </div>
        <nav className="flex-1 p-3 space-y-0.5 overflow-y-auto">
          {nav.map(item=>(
            <button key={item.id} onClick={()=>{setActive(item.id);setMobileOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all text-left relative ${active===item.id?'bg-red-600/15 text-red-400 before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:h-6 before:w-0.5 before:bg-red-500 before:rounded-full':'text-zinc-500 hover:bg-zinc-900 hover:text-zinc-300'}`}>
              <span className="text-base">{item.icon}</span>
              <span className="flex-1">{item.label}</span>
              {item.id==='notifications'&&unread>0&&<span className="bg-red-500 text-white text-xs rounded-full min-w-5 h-5 flex items-center justify-center px-1">{unread}</span>}
              {item.id==='messages'&&msgCount>0&&<span className="bg-red-500 text-white text-xs rounded-full min-w-5 h-5 flex items-center justify-center px-1">{msgCount}</span>}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-zinc-900">
          <div className="flex items-center gap-3 px-3 py-2.5 mb-1 rounded-xl bg-zinc-900/50">
            <Avatar name={profile.full_name} color={profile.avatar_color} size="sm"/>
            <div className="min-w-0 flex-1"><p className="text-sm font-medium truncate">{profile.full_name}</p><p className="text-xs text-zinc-600">{profile.role==='admin'?'Admin':'Helfer'}</p></div>
          </div>
          <button onClick={onLogout} className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm text-zinc-600 hover:bg-zinc-900 hover:text-zinc-400 transition-all">🚪 <span>Abmelden</span></button>
        </div>
      </aside>
    </>
  );
}

// ══════════════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════════════
function App() {
  const [user,setUser]=useState(undefined);
  const [profile,setProfile]=useState(null);
  const [activePage,setActivePage]=useState('dashboard');
  const [unread,setUnread]=useState(0);
  const [unreadMsgs,setUnreadMsgs]=useState(0);
  const [mobileOpen,setMobileOpen]=useState(false);
  const {show,Container}=useToast();
  const unsubRef=useRef(null);
  const unsubMsgRef=useRef(null);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(u)=>{
      setUser(u);
      if(u){
        await seedGroups();
        const p=await getDoc_(col('users').doc(u.uid));
        setProfile(p);
        if(unsubRef.current)unsubRef.current();
        unsubRef.current=col('notifications').where('user_id','==',u.uid).where('read','==',false).onSnapshot(snap=>{setUnread(snap.size);});
        if(p&&p.role==='admin'){
          if(unsubMsgRef.current)unsubMsgRef.current();
          unsubMsgRef.current=col('messages').where('read','==',false).onSnapshot(snap=>{setUnreadMsgs(snap.size);});
        }
      }else{setProfile(null);if(unsubRef.current)unsubRef.current();if(unsubMsgRef.current)unsubMsgRef.current();}
    });
    return()=>{unsub();if(unsubRef.current)unsubRef.current();if(unsubMsgRef.current)unsubMsgRef.current();};
  },[]);

  const logout=async()=>{await auth.signOut();setActivePage('dashboard');};

  if(user===undefined)return(
    <div className="min-h-screen flex items-center justify-center bg-zinc-950">
      <div className="text-center"><div className="w-20 h-20 bg-red-600 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-2xl shadow-red-900/50">⚽</div><div className="w-8 h-8 border-4 border-zinc-800 border-t-red-500 rounded-full animate-spin mx-auto"/></div>
    </div>
  );
  if(!user||!profile)return <><LoginPage/><Container/></>;

  const isAdmin=profile.role==='admin';
  const nav=isAdmin
    ?[{id:'dashboard',icon:'⊞',label:'Dashboard'},{id:'helpers',icon:'👥',label:'Helfer'},{id:'groups',icon:'🏢',label:'Orgagruppen'},{id:'tasks',icon:'✅',label:'Aufgaben'},{id:'availability',icon:'📅',label:'Verfügbarkeit'},{id:'messages',icon:'✉️',label:'Nachrichten'},{id:'notifications',icon:'🔔',label:'Benachrichtigungen'}]
    :[{id:'dashboard',icon:'⊞',label:'Übersicht'},{id:'availability',icon:'📅',label:'Verfügbarkeit'},{id:'tasks',icon:'✅',label:'Aufgaben'},{id:'message',icon:'✉️',label:'Nachricht senden'},{id:'notifications',icon:'🔔',label:'Benachrichtigungen'},{id:'profile',icon:'👤',label:'Mein Profil'}];

  const setPage=(page)=>{setActivePage(page);setMobileOpen(false);};

  const renderPage=()=>{
    if(isAdmin)switch(activePage){
      case 'dashboard':     return <AdminDashboard profile={profile} setPage={setPage}/>;
      case 'helpers':       return <AdminHelpers show={show}/>;
      case 'groups':        return <AdminGroups/>;
      case 'tasks':         return <AdminTasks show={show}/>;
      case 'availability':  return <AdminVerfügbarkeit/>;
      case 'messages':      return <AdminNachrichten show={show}/>;
      case 'notifications': return <AdminNotifications show={show}/>;
      default:              return <AdminDashboard profile={profile} setPage={setPage}/>;
    }
    switch(activePage){
      case 'dashboard':     return <HelperDashboard profile={profile} setPage={setPage}/>;
      case 'availability':  return <HelperVerfügbarkeit profile={profile} show={show}/>;
      case 'tasks':         return <HelperTasks profile={profile} show={show} defaultTab='all'/>;
      case 'grouptasks':    return <HelperTasks profile={profile} show={show} defaultTab='group'/>;
      case 'message':       return <HelperNachricht profile={profile} show={show}/>;
      case 'notifications': return <NotificationsPage profile={profile}/>;
      case 'profile':       return <HelperProfile profile={profile} show={show} onUpdate={setProfile}/>;
      default:              return <HelperDashboard profile={profile} setPage={setPage}/>;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden bg-zinc-950">
      <Sidebar nav={nav} active={activePage} setActive={setPage} profile={profile} unread={unread} msgCount={unreadMsgs} onLogout={logout} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div className="flex-1 flex flex-col overflow-hidden">
        <div className="md:hidden flex items-center justify-between px-4 py-3 bg-black border-b border-zinc-900">
          <button onClick={()=>setMobileOpen(true)} className="p-2 rounded-xl hover:bg-zinc-900 text-zinc-400">☰</button>
          <div className="flex items-center gap-2"><div className="w-6 h-6 bg-red-600 rounded-lg flex items-center justify-center text-sm">⚽</div><span className="font-semibold text-sm">{APP_NAME}</span></div>
          <div className="w-8"/>
        </div>
        <main className="flex-1 overflow-y-auto p-5 md:p-8"><div className="max-w-5xl mx-auto">{renderPage()}</div></main>
      </div>
      <Container/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
