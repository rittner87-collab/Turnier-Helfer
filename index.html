<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<div id="root"></div>

<script type="text/babel">
const firebaseConfig = {
  apiKey: "AIzaSyDdDD3INQExQJNYZ2ZdvhH55QNjMoR3DLQ",
  authDomain: "turnierhelfer-2027.firebaseapp.com",
  projectId: "turnierhelfer-2027",
  storageBucket: "turnierhelfer-2027.firebasestorage.app",
  messagingSenderId: "306397562073",
  appId: "1:306397562073:web:14c187226ab87d05eaaac8"
};
const APP_NAME        = 'Helferkoordination';
const TOURNAMENT_NAME = 'Internationales Fußballturnier';

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
const ts   = () => firebase.firestore.FieldValue.serverTimestamp();

const { useState, useEffect, useCallback, useRef } = React;

const toDate = (v) => { if (!v) return null; if (v.toDate) return v.toDate(); return new Date(v); };
const fmtDate = (v) => { const d=toDate(v); return d?d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'; };
const fmtDateTime = (v) => { const d=toDate(v); return d?d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'; };
const fmtTime = (v) => { const d=toDate(v); return d?d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'—'; };
const initials = (n='?') => (n||'?').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
const sortBy = (arr,key,desc=false) => [...arr].sort((a,b)=>{const va=toDate(a[key])||a[key]||'';const vb=toDate(b[key])||b[key]||'';return desc?(vb>va?1:-1):(va>vb?1:-1);});
const COLORS = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316'];
const randColor = () => COLORS[Math.floor(Math.random()*COLORS.length)];
const col = (name) => db.collection(name);
const getDocs = async (ref) => { const s=await ref.get(); return s.docs.map(d=>({id:d.id,...d.data()})); };
const getDoc  = async (ref) => { const s=await ref.get(); return s.exists?{id:s.id,...s.data()}:null; };

const Spinner = () => <div className="flex items-center justify-center p-10"><div className="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"/></div>;
const Badge = ({color='blue',children}) => { const c={blue:'bg-blue-100 text-blue-700',green:'bg-green-100 text-green-700',yellow:'bg-yellow-100 text-yellow-700',red:'bg-red-100 text-red-700',gray:'bg-gray-100 text-gray-600',purple:'bg-purple-100 text-purple-700'}; return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${c[color]||c.blue}`}>{children}</span>; };
const Avatar = ({name,color='#3B82F6',size='md'}) => { const s=size==='sm'?'w-7 h-7 text-xs':size==='lg'?'w-12 h-12 text-lg':'w-9 h-9 text-sm'; return <div className={`${s} rounded-full flex items-center justify-center font-bold text-white flex-shrink-0`} style={{background:color}}>{initials(name)}</div>; };
const Modal = ({title,onClose,children,wide}) => (
  <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div className="absolute inset-0 bg-black/40" onClick={onClose}/>
    <div className={`relative bg-white rounded-2xl shadow-2xl w-full ${wide?'max-w-2xl':'max-w-lg'} max-h-[90vh] overflow-y-auto`}>
      <div className="flex items-center justify-between p-5 border-b"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400">✕</button></div>
      <div className="p-5">{children}</div>
    </div>
  </div>
);
const Inp = ({label,...p}) => <div className="mb-4">{label&&<label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}<input className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" {...p}/></div>;
const Sel = ({label,children,...p}) => <div className="mb-4">{label&&<label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}<select className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" {...p}>{children}</select></div>;
const Txt = ({label,...p}) => <div className="mb-4">{label&&<label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}<textarea className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" rows={3} {...p}/></div>;
const Btn = ({variant='primary',size='md',className='',children,...p}) => { const v={primary:'bg-blue-600 hover:bg-blue-700 text-white',secondary:'bg-gray-100 hover:bg-gray-200 text-gray-700',danger:'bg-red-50 hover:bg-red-100 text-red-600',green:'bg-green-600 hover:bg-green-700 text-white',ghost:'hover:bg-gray-100 text-gray-600'}; const s=size==='sm'?'px-3 py-1.5 text-xs':size==='lg'?'px-6 py-3 text-base':'px-4 py-2 text-sm'; return <button className={`${v[variant]} ${s} rounded-lg font-medium transition-colors disabled:opacity-40 ${className}`} {...p}>{children}</button>; };

function Toast({msg,type='success',onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  const c={success:'bg-green-600',error:'bg-red-600',info:'bg-blue-600',warning:'bg-yellow-500'};
  return <div className={`${c[type]||c.info} text-white px-5 py-3 rounded-xl shadow-lg text-sm flex items-center gap-3 max-w-sm`}><span className="flex-1">{msg}</span><button onClick={onClose} className="opacity-70 hover:opacity-100">✕</button></div>;
}
function useToast() {
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type='success')=>setToasts(t=>[...t,{id:Date.now(),msg,type}]),[]);
  const rm=useCallback((id)=>setToasts(t=>t.filter(x=>x.id!==id)),[]);
  const Container=()=><div className="fixed bottom-5 right-5 z-[100] flex flex-col gap-2">{toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onClose={()=>rm(t.id)}/>)}</div>;
  return {show,Container};
}

const taskStatusLabel={open:'Offen',in_progress:'In Arbeit',done:'Erledigt'};
const taskStatusColor={open:'gray',in_progress:'yellow',done:'green'};
const priorityLabel={low:'Niedrig',normal:'Normal',high:'Hoch'};
const priorityColor={low:'blue',normal:'gray',high:'red'};

function LoginPage() {
  const [tab,setTab]=useState('login');
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [name,setName]=useState('');
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');

  const login=async(e)=>{e.preventDefault();setMsg('');setLoading(true);try{await auth.signInWithEmailAndPassword(email,pw);}catch(err){setMsg(err.message);}setLoading(false);};
  const register=async(e)=>{
    e.preventDefault();setMsg('');setLoading(true);
    try{
      const {user}=await auth.createUserWithEmailAndPassword(email,pw);
      const usersSnap=await col('users').limit(2).get();
      const isFirst=usersSnap.docs.filter(d=>d.id!==user.uid).length===0;
      await col('users').doc(user.uid).set({full_name:name,phone:'',role:isFirst?'admin':'helper',avatar_color:randColor(),created_at:ts()});
    }catch(err){setMsg(err.message);}
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-green-700 to-green-900 flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8"><div className="text-5xl mb-3">⚽</div><h1 className="text-3xl font-bold text-white">{APP_NAME}</h1><p className="text-green-200 mt-1 text-sm">{TOURNAMENT_NAME}</p></div>
        <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
          <div className="flex border-b">{[['login','🔐 Anmelden'],['register','✍️ Registrieren']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} className={`flex-1 py-3.5 text-sm font-semibold transition-colors ${tab===v?'text-green-700 border-b-2 border-green-700 bg-green-50':'text-gray-500 hover:text-gray-700'}`}>{l}</button>)}</div>
          <form onSubmit={tab==='login'?login:register} className="p-6">
            {tab==='register'&&<Inp label="Vollständiger Name" value={name} onChange={e=>setName(e.target.value)} placeholder="Max Mustermann" required/>}
            <Inp label="E-Mail" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@beispiel.de" required/>
            <Inp label="Passwort" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" required minLength={6}/>
            {msg&&<p className="text-sm text-red-500 mb-4">{msg}</p>}
            <Btn variant="green" size="lg" className="w-full" disabled={loading} type="submit">{loading?'⏳ Bitte warten…':tab==='login'?'Anmelden':'Konto erstellen'}</Btn>
            {tab==='register'&&<p className="text-xs text-gray-400 mt-3 text-center">Der erste Account wird automatisch Admin.</p>}
          </form>
        </div>
      </div>
    </div>
  );
}

function AdminDashboard({profile}) {
  const [stats,setStats]=useState({helpers:0,groups:0,tasks:0,shifts:0});
  const [recentTasks,setRecentTasks]=useState([]);
  const [upcomingShifts,setUpcomingShifts]=useState([]);
  useEffect(()=>{(async()=>{
    const [users,groups,tasks,shifts]=await Promise.all([getDocs(col('users')),getDocs(col('groups')),getDocs(col('tasks')),getDocs(col('shifts'))]);
    const userMap=Object.fromEntries(users.map(u=>[u.id,u]));
    setStats({helpers:users.filter(u=>u.role==='helper').length,groups:groups.length,tasks:tasks.length,shifts:shifts.length});
    setRecentTasks(sortBy(tasks,'created_at',true).slice(0,5).map(t=>({...t,profile:t.assigned_to?userMap[t.assigned_to]:null})));
    setUpcomingShifts(sortBy(shifts.filter(s=>toDate(s.start_time)>=new Date()),'start_time').slice(0,5));
  })();},[]);
  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">Willkommen, {(profile.full_name||'').split(' ')[0]} 👋</h1>
      <p className="text-gray-500 mb-6 text-sm">{TOURNAMENT_NAME} · Admin</p>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {[{l:'Helfer',v:stats.helpers,i:'👤'},{l:'Orgagruppen',v:stats.groups,i:'🏢'},{l:'Aufgaben',v:stats.tasks,i:'✅'},{l:'Schichten',v:stats.shifts,i:'⏰'}].map(s=>(
          <div key={s.l} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><div className="text-2xl mb-2">{s.i}</div><div className="text-3xl font-bold">{s.v}</div><div className="text-sm text-gray-500 mt-1">{s.l}</div></div>
        ))}
      </div>
      <div className="grid lg:grid-cols-2 gap-5">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 className="font-semibold mb-4">✅ Neueste Aufgaben</h2>
          {recentTasks.length===0?<p className="text-gray-400 text-sm">Keine Aufgaben</p>:<div className="space-y-3">{recentTasks.map(t=><div key={t.id} className="flex items-center justify-between py-2 border-b last:border-0"><div><p className="text-sm font-medium">{t.title}</p><p className="text-xs text-gray-400">{t.profile?.full_name||'Nicht zugewiesen'}</p></div><Badge color={taskStatusColor[t.status]}>{taskStatusLabel[t.status]}</Badge></div>)}</div>}
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 className="font-semibold mb-4">⏰ Nächste Schichten</h2>
          {upcomingShifts.length===0?<p className="text-gray-400 text-sm">Keine Schichten geplant</p>:<div className="space-y-3">{upcomingShifts.map(s=><div key={s.id} className="py-2 border-b last:border-0"><p className="text-sm font-medium">{s.title}</p><p className="text-xs text-gray-400">{fmtDateTime(s.start_time)} – {fmtTime(s.end_time)}</p></div>)}</div>}
        </div>
      </div>
    </div>
  );
}

function AdminHelpers({show}) {
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [sel,setSel]=useState(null);
  const [addGrp,setAddGrp]=useState('');
  const load=async()=>{setLoading(true);const [u,g,m]=await Promise.all([getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name')),getDocs(col('memberships'))]);setUsers(u);setGroups(g);setMemberships(m);setLoading(false);};
  useEffect(()=>{load();},[]);
  const assignGroup=async()=>{if(!addGrp||!sel)return;if(memberships.find(m=>m.user_id===sel.id&&m.group_id===addGrp))return;await col('memberships').add({user_id:sel.id,group_id:addGrp,role:'member',created_at:ts()});load();setAddGrp('');show('Gruppe zugewiesen');};
  const removeFromGroup=async(uid,gid)=>{const m=memberships.find(x=>x.user_id===uid&&x.group_id===gid);if(m)await col('memberships').doc(m.id).delete();load();};
  const toggleAdmin=async(u)=>{const r=u.role==='admin'?'helper':'admin';await col('users').doc(u.id).update({role:r});load();show(`${u.full_name} ist jetzt ${r==='admin'?'Admin':'Helfer'}`);};
  const filtered=users.filter(u=>(u.full_name||'').toLowerCase().includes(search.toLowerCase()));
  const userGroups=(uid)=>memberships.filter(m=>m.user_id===uid).map(m=>groups.find(g=>g.id===m.group_id)).filter(Boolean);
  const assignedGroups=sel?userGroups(sel.id):[];
  const availableGroups=groups.filter(g=>!assignedGroups.find(ag=>ag.id===g.id));
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">👤 Helfer verwalten</h1>
      <input value={search} onChange={e=>setSearch(e.target.value)} className="border border-gray-300 rounded-lg px-3 py-2 text-sm w-full max-w-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Suchen…"/>
      {loading?<Spinner/>:(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 border-b"><tr><th className="text-left px-4 py-3 font-medium text-gray-500">Name</th><th className="text-left px-4 py-3 font-medium text-gray-500 hidden md:table-cell">Gruppen</th><th className="text-left px-4 py-3 font-medium text-gray-500 hidden md:table-cell">Rolle</th><th className="px-4 py-3"/></tr></thead>
            <tbody>{filtered.map(u=><tr key={u.id} className="border-b last:border-0 hover:bg-gray-50"><td className="px-4 py-3"><div className="flex items-center gap-3"><Avatar name={u.full_name} color={u.avatar_color}/><span className="font-medium">{u.full_name}</span></div></td><td className="px-4 py-3 hidden md:table-cell"><div className="flex flex-wrap gap-1">{userGroups(u.id).map(g=><span key={g.id} className="text-xs px-2 py-0.5 rounded-full text-white" style={{background:g.color}}>{g.icon} {g.name}</span>)}</div></td><td className="px-4 py-3 hidden md:table-cell"><Badge color={u.role==='admin'?'purple':'gray'}>{u.role==='admin'?'Admin':'Helfer'}</Badge></td><td className="px-4 py-3 text-right"><Btn variant="ghost" size="sm" onClick={()=>setSel(u)}>Bearbeiten</Btn></td></tr>)}</tbody>
          </table>
        </div>
      )}
      {sel&&(
        <Modal title={`Helfer: ${sel.full_name}`} onClose={()=>setSel(null)}>
          <div className="flex items-center gap-3 mb-5 pb-4 border-b"><Avatar name={sel.full_name} color={sel.avatar_color} size="lg"/><div><p className="font-semibold text-lg">{sel.full_name}</p><Badge color={sel.role==='admin'?'purple':'gray'}>{sel.role==='admin'?'Admin':'Helfer'}</Badge></div></div>
          <h3 className="font-medium mb-3 text-xs text-gray-500 uppercase tracking-wider">Gruppen</h3>
          {assignedGroups.length===0?<p className="text-sm text-gray-400 mb-3">Keine Gruppe zugewiesen</p>:<div className="flex flex-wrap gap-2 mb-4">{assignedGroups.map(g=><span key={g.id} className="flex items-center gap-1.5 text-sm px-3 py-1 rounded-full text-white" style={{background:g.color}}>{g.icon} {g.name}<button onClick={()=>removeFromGroup(sel.id,g.id)} className="ml-1 opacity-70 hover:opacity-100">✕</button></span>)}</div>}
          {availableGroups.length>0&&<div className="flex gap-2 mb-5"><select value={addGrp} onChange={e=>setAddGrp(e.target.value)} className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">Gruppe wählen…</option>{availableGroups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}</select><Btn onClick={assignGroup} disabled={!addGrp}>Hinzufügen</Btn></div>}
          <div className="border-t pt-4 flex justify-between"><Btn variant="secondary" onClick={()=>toggleAdmin(sel)}>{sel.role==='admin'?'⬇️ Zu Helfer':'⬆️ Zu Admin'}</Btn><Btn variant="secondary" onClick={()=>setSel(null)}>Schließen</Btn></div>
        </Modal>
      )}
    </div>
  );
}

function AdminGroups({show}) {
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showForm,setShowForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({name:'',description:'',icon:'👥',color:COLORS[0]});
  const ICONS=['👥','🏟️','🎯','🛡️','🚑','📋','🔧','🎤','🚌','🍕','🎫','📸','🏃','🔐','⚽','🧹','🎪','🚦'];
  const load=async()=>{setLoading(true);const [g,m]=await Promise.all([getDocs(col('groups').orderBy('name')),getDocs(col('memberships'))]);setGroups(g);setMemberships(m);setLoading(false);};
  useEffect(()=>{load();},[]);
  const save=async()=>{if(!form.name.trim())return;if(editing)await col('groups').doc(editing.id).update(form);else await col('groups').add({...form,created_at:ts()});load();setShowForm(false);show(editing?'Gruppe aktualisiert':'Gruppe erstellt');};
  const del=async(g)=>{if(!confirm(`Gruppe "${g.name}" wirklich löschen?`))return;await col('groups').doc(g.id).delete();load();show('Gruppe gelöscht');};
  return (
    <div>
      <div className="flex items-center justify-between mb-5"><h1 className="text-2xl font-bold">🏢 Orgagruppen</h1><Btn onClick={()=>{setEditing(null);setForm({name:'',description:'',icon:'👥',color:COLORS[0]});setShowForm(true);}}>+ Neue Gruppe</Btn></div>
      {loading?<Spinner/>:(
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          {groups.map(g=>{const mems=memberships.filter(m=>m.group_id===g.id);return(
            <div key={g.id} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
              <div className="flex items-start justify-between mb-3"><div className="flex items-center gap-2"><span className="text-2xl">{g.icon}</span><div><h3 className="font-semibold">{g.name}</h3>{g.description&&<p className="text-xs text-gray-400">{g.description}</p>}</div></div><div className="w-3 h-3 rounded-full" style={{background:g.color}}/></div>
              <p className="text-xs text-gray-400 mb-3">{mems.length} Mitglied{mems.length!==1?'er':''}</p>
              <div className="flex gap-2"><Btn variant="secondary" size="sm" onClick={()=>{setEditing(g);setForm({name:g.name,description:g.description||'',icon:g.icon||'👥',color:g.color||COLORS[0]});setShowForm(true);}}>Bearbeiten</Btn><Btn variant="danger" size="sm" onClick={()=>del(g)}>Löschen</Btn></div>
            </div>
          );})}
          {groups.length===0&&<p className="text-gray-400 text-sm">Noch keine Gruppen.</p>}
        </div>
      )}
      {showForm&&(
        <Modal title={editing?'Gruppe bearbeiten':'Neue Gruppe'} onClose={()=>setShowForm(false)}>
          <Inp label="Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="z.B. Einlasskontrolle"/>
          <Txt label="Beschreibung" value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/>
          <div className="mb-4"><label className="block text-sm font-medium text-gray-700 mb-2">Icon</label><div className="flex flex-wrap gap-2">{ICONS.map(ic=><button key={ic} onClick={()=>setForm({...form,icon:ic})} className={`text-xl p-1.5 rounded-lg ${form.icon===ic?'bg-blue-100 ring-2 ring-blue-400':'hover:bg-gray-100'}`}>{ic}</button>)}</div></div>
          <div className="mb-5"><label className="block text-sm font-medium text-gray-700 mb-2">Farbe</label><div className="flex gap-2">{COLORS.map(c=><button key={c} onClick={()=>setForm({...form,color:c})} className={`w-8 h-8 rounded-full ${form.color===c?'ring-2 ring-offset-2 ring-gray-400 scale-110':''}`} style={{background:c}}/>)}</div></div>
          <div className="flex justify-end gap-3"><Btn variant="secondary" onClick={()=>setShowForm(false)}>Abbrechen</Btn><Btn onClick={save} disabled={!form.name.trim()}>{editing?'Speichern':'Erstellen'}</Btn></div>
        </Modal>
      )}
    </div>
  );
}

function AdminTasks({show}) {
  const [tasks,setTasks]=useState([]);
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showForm,setShowForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const [filter,setFilter]=useState('all');

function AdminNotifications({show}) {
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [form,setForm]=useState({title:'',message:'',type:'info',target:'all',group_id:'',user_id:''});
  const [sending,setSending]=useState(false);
  useEffect(()=>{(async()=>{const [u,g,m]=await Promise.all([getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name')),getDocs(col('memberships'))]);setUsers(u);setGroups(g);setMemberships(m);})();},[]);
  const send=async()=>{
    if(!form.title.trim()||!form.message.trim())return;setSending(true);
    let recipients=[];
    if(form.target==='all')recipients=users.map(u=>u.id);
    else if(form.target==='group')recipients=memberships.filter(m=>m.group_id===form.group_id).map(m=>m.user_id);
    else if(form.target==='single'&&form.user_id)recipients=[form.user_id];
    if(recipients.length===0){show('Keine Empfänger','error');setSending(false);return;}
    const batch=db.batch();
    recipients.forEach(uid=>{const ref=col('notifications').doc();batch.set(ref,{user_id:uid,title:form.title,message:form.message,type:form.type,read:false,created_at:ts()});});
    await batch.commit();
    show(`Gesendet an ${recipients.length} Person(en)`);
    setForm({title:'',message:'',type:'info',target:'all',group_id:'',user_id:''});
    setSending(false);
  };
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">🔔 Benachrichtigungen senden</h1>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 max-w-2xl">
        <Inp label="Titel" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="z.B. Wichtige Information"/>
        <Txt label="Nachricht" value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Deine Nachricht…"/>
        <div className="grid grid-cols-2 gap-4">
          <Sel label="Typ" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}><option value="info">ℹ️ Info</option><option value="success">✅ Erfolg</option><option value="warning">⚠️ Warnung</option><option value="error">❌ Dringend</option></Sel>
          <Sel label="Empfänger" value={form.target} onChange={e=>setForm({...form,target:e.target.value,group_id:'',user_id:''})}><option value="all">Alle Helfer</option><option value="group">Gruppe</option><option value="single">Einzelne Person</option></Sel>
        </div>
        {form.target==='group'&&<Sel label="Gruppe" value={form.group_id} onChange={e=>setForm({...form,group_id:e.target.value})}><option value="">Gruppe wählen…</option>{groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}</Sel>}
        {form.target==='single'&&<Sel label="Person" value={form.user_id} onChange={e=>setForm({...form,user_id:e.target.value})}><option value="">Person wählen…</option>{users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}</Sel>}
        <div className="flex justify-end"><Btn onClick={send} disabled={sending||!form.title.trim()||!form.message.trim()}>{sending?'⏳ Sende…':'📤 Senden'}</Btn></div>
      </div>
    </div>
  );
}

function HelperShifts({profile,show}) {
  const [shifts,setShifts]=useState([]);
  const [mySignups,setMySignups]=useState([]);
  const [allSignups,setAllSignups]=useState([]);
  const [groups,setGroups]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('available');
  const load=async()=>{setLoading(true);const [sh,si,mysi,g]=await Promise.all([getDocs(col('shifts')),getDocs(col('signups')),getDocs(col('signups').where('user_id','==',profile.id)),getDocs(col('groups'))]);const gMap=Object.fromEntries(g.map(x=>[x.id,x]));setShifts(sortBy(sh,'start_time').map(x=>({...x,group:x.group_id?gMap[x.group_id]:null})));setAllSignups(si);setMySignups(mysi.map(s=>s.shift_id));setGroups(g);setLoading(false);};
  useEffect(()=>{load();},[profile]);
  const signup=async(sid)=>{await col('signups').add({shift_id:sid,user_id:profile.id,created_at:ts()});load();show('Erfolgreich angemeldet! ✅');};
  const unsignup=async(sid)=>{const s=(await getDocs(col('signups').where('shift_id','==',sid).where('user_id','==',profile.id)))[0];if(s)await col('signups').doc(s.id).delete();load();show('Abgemeldet','info');};
  const now=new Date();
  const isSigned=(id)=>mySignups.includes(id);
  const ShiftCard=({s})=>{const signed=isSigned(s.id);const count=allSignups.filter(x=>x.shift_id===s.id).length;const full=count>=s.max_helpers;const isPast=toDate(s.start_time)<now;return(
    <div className={`bg-white rounded-xl shadow-sm border p-5 ${signed?'border-green-200 bg-green-50':'border-gray-100'}`}>
      <div className="flex items-start justify-between">
        <div className="flex-1"><div className="flex items-center gap-2 flex-wrap mb-1"><h3 className="font-semibold">{s.title}</h3>{s.group&&<span className="text-xs px-2 py-0.5 rounded-full text-white" style={{background:s.group.color}}>{s.group.icon} {s.group.name}</span>}{signed&&<Badge color="green">✓ Angemeldet</Badge>}</div><p className="text-sm text-gray-500">{fmtDateTime(s.start_time)} – {fmtTime(s.end_time)}</p>{s.location&&<p className="text-sm text-gray-400">📍 {s.location}</p>}<p className="text-xs text-gray-400 mt-2">👥 {count}/{s.max_helpers} Helfer</p></div>
        {!isPast&&<div className="ml-4">{signed?<Btn variant="danger" size="sm" onClick={()=>unsignup(s.id)}>Abmelden</Btn>:<Btn variant="green" size="sm" onClick={()=>signup(s.id)} disabled={full}>{full?'Ausgebucht':'Anmelden'}</Btn>}</div>}
      </div>
    </div>
  );};
  const upcoming=shifts.filter(s=>toDate(s.start_time)>=now);
  const past=shifts.filter(s=>toDate(s.start_time)<now);
  const mine=shifts.filter(s=>isSigned(s.id));
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">⏰ Schichten</h1>
      <div className="flex gap-2 mb-4">{[['available','Verfügbar'],['mine','Meine Schichten'],['past','Vergangen']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${tab===v?'bg-blue-600 text-white':'bg-white text-gray-600 border hover:bg-gray-50'}`}>{l}</button>)}</div>
      {loading?<Spinner/>:<div className="space-y-3">{tab==='available'&&(upcoming.length===0?<p className="text-gray-400 text-sm">Keine verfügbaren Schichten</p>:upcoming.map(s=><ShiftCard key={s.id} s={s}/>))}{tab==='mine'&&(mine.length===0?<p className="text-gray-400 text-sm">Noch nicht angemeldet</p>:mine.map(s=><ShiftCard key={s.id} s={s}/>))}{tab==='past'&&(past.length===0?<p className="text-gray-400 text-sm">Keine vergangenen Schichten</p>:past.map(s=><ShiftCard key={s.id} s={s}/>))}</div>}
    </div>
  );
}

  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">✅ Meine Aufgaben</h1>
      {loading?<Spinner/>:<div className="space-y-3">{tasks.map(t=><div key={t.id} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><div className="flex items-start justify-between"><div className="flex-1"><div className="flex items-center gap-2 flex-wrap mb-1"><h3 className="font-semibold">{t.title}</h3><Badge color={priorityColor[t.priority]}>{priorityLabel[t.priority]}</Badge>{t.group&&<span className="text-xs px-2 py-0.5 rounded-full text-white" style={{background:t.group.color}}>{t.group.icon} {t.group.name}</span>}</div>{t.description&&<p className="text-sm text-gray-500 mb-2">{t.description}</p>}<div className="flex gap-4 text-xs text-gray-400">{t.due_date&&<span>📅 {fmtDateTime(t.due_date)}</span>}{t.location&&<span>📍 {t.location}</span>}</div></div><div className="ml-4"><Sel value={t.status} onChange={e=>updateStatus(t.id,e.target.value)}><option value="open">Offen</option><option value="in_progress">In Arbeit</option><option value="done">Erledigt</option></Sel></div></div></div>)}{tasks.length===0&&<p className="text-gray-400 text-sm">Keine Aufgaben zugewiesen.</p>}</div>}
    </div>
  );
}

function NotificationsPage({profile}) {
  const [notifs,setNotifs]=useState([]);
  const [loading,setLoading]=useState(true);
  const load=async()=>{setLoading(true);const n=await getDocs(col('notifications').where('user_id','==',profile.id));setNotifs(sortBy(n,'created_at',true));setLoading(false);};
  useEffect(()=>{load();},[profile]);
  const markRead=async(id)=>{await col('notifications').doc(id).update({read:true});setNotifs(n=>n.map(x=>x.id===id?{...x,read:true}:x));};
  const markAll=async()=>{const batch=db.batch();notifs.filter(n=>!n.read).forEach(n=>batch.update(col('notifications').doc(n.id),{read:true}));await batch.commit();setNotifs(n=>n.map(x=>({...x,read:true})));};
  const typeIcon={info:'ℹ️',success:'✅',warning:'⚠️',error:'❌'};
  const typeBg={info:'bg-blue-50 border-blue-100',success:'bg-green-50 border-green-100',warning:'bg-yellow-50 border-yellow-100',error:'bg-red-50 border-red-100'};
  const unread=notifs.filter(n=>!n.read).length;
  return (
    <div>
      <div className="flex items-center justify-between mb-5"><h1 className="text-2xl font-bold">🔔 Benachrichtigungen {unread>0&&<span className="ml-2 text-sm font-normal bg-red-100 text-red-600 px-2 py-0.5 rounded-full">{unread} neu</span>}</h1>{unread>0&&<Btn variant="secondary" size="sm" onClick={markAll}>Alle gelesen</Btn>}</div>
      {loading?<Spinner/>:<div className="space-y-2">{notifs.map(n=><div key={n.id} onClick={()=>!n.read&&markRead(n.id)} className={`bg-white rounded-xl border ${typeBg[n.type]||typeBg.info} p-4 cursor-pointer`}><div className="flex items-start gap-3"><span className="text-xl">{typeIcon[n.type]||'ℹ️'}</span><div className="flex-1"><div className="flex items-center justify-between"><p className={`text-sm ${!n.read?'font-semibold':''}`}>{n.title}</p><span className="text-xs text-gray-400">{fmtDateTime(n.created_at)}</span></div><p className="text-sm text-gray-600 mt-0.5">{n.message}</p></div>{!n.read&&<div className="w-2 h-2 rounded-full bg-blue-500 mt-1.5"/>}</div></div>)}{notifs.length===0&&<p className="text-gray-400 text-sm">Keine Benachrichtigungen</p>}</div>}
    </div>
  );
}

function HelperProfile({profile,show,onUpdate}) {
  const [form,setForm]=useState({full_name:profile.full_name||'',phone:profile.phone||''});
  const [pw,setPw]=useState('');
  const save=async()=>{await col('users').doc(profile.id).update(form);onUpdate({...profile,...form});show('Profil gespeichert');};
  const changePw=async()=>{if(pw.length<6){show('Mindestens 6 Zeichen','error');return;}try{await auth.currentUser.updatePassword(pw);show('Passwort geändert');setPw('');}catch(e){show(e.message,'error');}};
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">👤 Mein Profil</h1>
      <div className="grid md:grid-cols-2 gap-5">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><h2 className="font-semibold mb-4">Persönliche Daten</h2><div className="flex items-center gap-4 mb-5"><Avatar name={profile.full_name} color={profile.avatar_color} size="lg"/><div><p className="font-semibold">{profile.full_name}</p><Badge color={profile.role==='admin'?'purple':'gray'}>{profile.role==='admin'?'Admin':'Helfer'}</Badge></div></div><Inp label="Name" value={form.full_name} onChange={e=>setForm({...form,full_name:e.target.value})}/><Inp label="Telefon" type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+49 …"/><Btn onClick={save}>Speichern</Btn></div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><h2 className="font-semibold mb-4">Passwort ändern</h2><Inp label="Neues Passwort" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Mind. 6 Zeichen"/><Btn onClick={changePw} disabled={pw.length<6}>Passwort ändern</Btn></div>
      </div>
    </div>
  );
}

function Sidebar({nav,active,setActive,profile,unread,onLogout,mobileOpen,setMobileOpen}) {
  return (
    <>
      {mobileOpen&&<div className="fixed inset-0 z-20 bg-black/40 md:hidden" onClick={()=>setMobileOpen(false)}/>}
      <aside className={`fixed md:static inset-y-0 left-0 z-30 w-64 flex-shrink-0 bg-gradient-to-b from-green-800 to-green-900 text-white flex flex-col transition-transform duration-200 ${mobileOpen?'translate-x-0':'-translate-x-full md:translate-x-0'}`}>
        <div className="p-5 border-b border-green-700"><div className="flex items-center gap-2"><span className="text-2xl">⚽</span><div><p className="font-bold text-sm">{APP_NAME}</p><p className="text-green-300 text-xs truncate max-w-[150px]">{TOURNAMENT_NAME}</p></div></div></div>
        <nav className="flex-1 p-3 space-y-1 overflow-y-auto">{nav.map(item=><button key={item.id} onClick={()=>{setActive(item.id);setMobileOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-left ${active===item.id?'bg-white/15 text-white':'text-green-100 hover:bg-white/10'}`}><span className="text-lg">{item.icon}</span><span className="flex-1">{item.label}</span>{item.id==='notifications'&&unread>0&&<span className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{unread}</span>}</button>)}</nav>
        <div className="p-3 border-t border-green-700"><div className="flex items-center gap-3 px-3 py-2 mb-1"><Avatar name={profile.full_name} color={profile.avatar_color} size="sm"/><div className="min-w-0"><p className="text-sm font-medium truncate">{profile.full_name}</p><p className="text-xs text-green-300">{profile.role==='admin'?'Admin':'Helfer'}</p></div></div><button onClick={onLogout} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-green-200 hover:bg-white/10 transition-colors">🚪 Abmelden</button></div>
      </aside>
    </>
  );
}

function App() {
  const [user,setUser]=useState(undefined);
  const [profile,setProfile]=useState(null);
  const [activePage,setActivePage]=useState('dashboard');
  const [unread,setUnread]=useState(0);
  const [mobileOpen,setMobileOpen]=useState(false);
  const {show,Container}=useToast();
  const unsubRef=useRef(null);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(u)=>{
      setUser(u);
      if(u){
        const p=await getDoc(col('users').doc(u.uid));
        setProfile(p);
        if(unsubRef.current)unsubRef.current();
        unsubRef.current=col('notifications').where('user_id','==',u.uid).where('read','==',false).onSnapshot(snap=>{setUnread(snap.size);});
      }else{setProfile(null);if(unsubRef.current)unsubRef.current();}
    });
    return()=>{unsub();if(unsubRef.current)unsubRef.current();};
  },[]);

  const logout=async()=>{await auth.signOut();setActivePage('dashboard');};

  if(user===undefined)return <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-700 to-green-900"><div className="text-center text-white"><div className="text-5xl mb-4">⚽</div><div className="w-8 h-8 border-4 border-white/30 border-t-white rounded-full animate-spin mx-auto"/></div></div>;
  if(!user||!profile)return <><LoginPage/><Container/></>;

  const isAdmin=profile.role==='admin';
  const nav=isAdmin
    ?[{id:'dashboard',icon:'🏠',label:'Dashboard'},{id:'helpers',icon:'👥',label:'Helfer'},{id:'groups',icon:'🏢',label:'Orgagruppen'},{id:'tasks',icon:'✅',label:'Aufgaben'},{id:'shifts',icon:'⏰',label:'Schichten'},{id:'notifications',icon:'🔔',label:'Benachrichtigungen'}]
    :[{id:'dashboard',icon:'🏠',label:'Übersicht'},{id:'shifts',icon:'⏰',label:'Schichten'},{id:'tasks',icon:'✅',label:'Meine Aufgaben'},{id:'notifications',icon:'🔔',label:'Benachrichtigungen'},{id:'profile',icon:'👤',label:'Mein Profil'}];

  const renderPage=()=>{
    if(isAdmin)switch(activePage){case 'dashboard':return <AdminDashboard profile={profile}/>;case 'helpers':return <AdminHelpers show={show}/>;case 'groups':return <AdminGroups show={show}/>;case 'tasks':return <AdminTasks show={show}/>;case 'shifts':return <AdminShifts show={show}/>;case 'notifications':return <AdminNotifications show={show}/>;default:return <AdminDashboard profile={profile}/>;}
    switch(activePage){case 'dashboard':return <HelperDashboard profile={profile}/>;case 'shifts':return <HelperShifts profile={profile} show={show}/>;case 'tasks':return <HelperTasks profile={profile} show={show}/>;case 'notifications':return <NotificationsPage profile={profile}/>;case 'profile':return <HelperProfile profile={profile} show={show} onUpdate={setProfile}/>;default:return <HelperDashboard profile={profile}/>;}
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar nav={nav} active={activePage} setActive={setActivePage} profile={profile} unread={unread} onLogout={logout} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div className="flex-1 flex flex-col overflow-hidden">
        <div className="md:hidden flex items-center justify-between px-4 py-3 bg-white border-b"><button onClick={()=>setMobileOpen(true)} className="p-2 rounded-lg hover:bg-gray-100 text-xl">☰</button><span className="font-semibold text-sm">{APP_NAME}</span><div className="w-8"/></div>
        <main className="flex-1 overflow-y-auto p-5 md:p-8"><div className="max-w-5xl mx-auto">{renderPage()}</div></main>
      </div>
      <Container/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
