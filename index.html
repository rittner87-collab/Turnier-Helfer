  { id:'12.08', label:'Di 12.08.', note:'Aufbautag' },
  { id:'13.08', label:'Mi 13.08.', note:'' },

  { name:'Turnierleitung',    icon:'🏆', color:'#8B5CF6', description:'Frank Rittner, Michel Kaden',           no_helpers:true  },
  { name:'Catering',          icon:'🍕', color:'#F97316', description:'Yvonne Rittner, Michel Kaden',          no_helpers:false },

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
const ts   = () => firebase.firestore.FieldValue.serverTimestamp();
const { useState, useEffect, useCallback, useRef } = React;

const col      = (n) => db.collection(n);
const getDocs  = async (ref) => { const s=await ref.get(); return s.docs.map(d=>({id:d.id,...d.data()})); };
const getDoc_  = async (ref) => { const s=await ref.get(); return s.exists?{id:s.id,...s.data()}:null; };
const initials = (n='?') => (n||'?').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
const sortBy   = (arr,key,desc=false) => [...arr].sort((a,b)=>{ const va=a[key]||''; const vb=b[key]||''; return desc?(vb>va?1:-1):(va>vb?1:-1); });
const COLORS   = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316'];
const randColor= () => COLORS[Math.floor(Math.random()*COLORS.length)];

// Gruppen automatisch anlegen wenn noch keine vorhanden
const seedGroups = async () => {
  const existing = await getDocs(col('groups'));
  if (existing.length > 0) return;
  const batch = db.batch();
  TOURNAMENT_GROUPS.forEach(g => {
    const ref = col('groups').doc();
    batch.set(ref, { ...g, created_at: ts() });
  });
  await batch.commit();
};

// ── UI Bausteine ──────────────────────────────────────────────
const Spinner = () => <div className="flex items-center justify-center p-10"><div className="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"/></div>;
const Badge = ({color='blue',children}) => {
  const c={blue:'bg-blue-100 text-blue-700',green:'bg-green-100 text-green-700',yellow:'bg-yellow-100 text-yellow-700',red:'bg-red-100 text-red-700',gray:'bg-gray-100 text-gray-600',purple:'bg-purple-100 text-purple-700',pink:'bg-pink-100 text-pink-700'};
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${c[color]||c.blue}`}>{children}</span>;
};
const Avatar = ({name,color='#3B82F6',size='md'}) => {
  const s=size==='sm'?'w-7 h-7 text-xs':size==='lg'?'w-12 h-12 text-lg':'w-9 h-9 text-sm';
  return <div className={`${s} rounded-full flex items-center justify-center font-bold text-white flex-shrink-0`} style={{background:color}}>{initials(name)}</div>;
};
const Modal = ({title,onClose,children,wide}) => (
  <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div className="absolute inset-0 bg-black/40" onClick={onClose}/>
    <div className={`relative bg-white rounded-2xl shadow-2xl w-full ${wide?'max-w-2xl':'max-w-lg'} max-h-[90vh] overflow-y-auto`}>
      <div className="flex items-center justify-between p-5 border-b"><h2 className="text-lg font-semibold">{title}</h2><button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400">✕</button></div>
      <div className="p-5">{children}</div>
    </div>
  </div>
);
const Inp = ({label,...p}) => <div className="mb-4">{label&&<label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}<input className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" {...p}/></div>;
const Sel = ({label,children,...p}) => <div className="mb-4">{label&&<label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}<select className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" {...p}>{children}</select></div>;
const Txt = ({label,...p}) => <div className="mb-4">{label&&<label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>}<textarea className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" rows={3} {...p}/></div>;
const Btn = ({variant='primary',size='md',className='',children,...p}) => {
  const v={primary:'bg-blue-600 hover:bg-blue-700 text-white',secondary:'bg-gray-100 hover:bg-gray-200 text-gray-700',danger:'bg-red-50 hover:bg-red-100 text-red-600',green:'bg-green-600 hover:bg-green-700 text-white',ghost:'hover:bg-gray-100 text-gray-600'};
  const s=size==='sm'?'px-3 py-1.5 text-xs':size==='lg'?'px-6 py-3 text-base':'px-4 py-2 text-sm';
  return <button className={`${v[variant]} ${s} rounded-lg font-medium transition-colors disabled:opacity-40 ${className}`} {...p}>{children}</button>;
};
function Toast({msg,type='success',onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  const c={success:'bg-green-600',error:'bg-red-600',info:'bg-blue-600',warning:'bg-yellow-500'};
  return <div className={`${c[type]||c.info} text-white px-5 py-3 rounded-xl shadow-lg text-sm flex items-center gap-3 max-w-sm`}><span className="flex-1">{msg}</span><button onClick={onClose} className="opacity-70 hover:opacity-100">✕</button></div>;
}
function useToast() {
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type='success')=>setToasts(t=>[...t,{id:Date.now(),msg,type}]),[]);
  const rm=useCallback((id)=>setToasts(t=>t.filter(x=>x.id!==id)),[]);
  const Container=()=><div className="fixed bottom-5 right-5 z-[100] flex flex-col gap-2">{toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onClose={()=>rm(t.id)}/>)}</div>;
  return {show,Container};
}

const taskStatusLabel={open:'Offen',in_progress:'In Arbeit',done:'Erledigt'};
const taskStatusColor={open:'gray',in_progress:'yellow',done:'green'};
const priorityLabel={low:'Niedrig',normal:'Normal',high:'Hoch'};
const priorityColor={low:'blue',normal:'gray',high:'red'};

// ANMELDESEITE
// ══════════════════════════════════════════════════════════════
function LoginPage() {
  const [tab,setTab]=useState('login');
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [name,setName]=useState('');
  const [groupId,setGroupId]=useState('');
  const [groups,setGroups]=useState([]);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');

  useEffect(()=>{ getDocs(col('groups').orderBy('name')).then(g=>setGroups(g.filter(x=>!x.no_helpers))); },[]);

  const login=async(e)=>{e.preventDefault();setMsg('');setLoading(true);try{await auth.signInWithEmailAndPassword(email,pw);}catch(err){setMsg(err.message);}setLoading(false);};
  const register=async(e)=>{
    e.preventDefault();setMsg('');setLoading(true);
    try{
      if(!groupId){setMsg('Bitte eine Orgagruppe wählen.');setLoading(false);return;}
      const {user}=await auth.createUserWithEmailAndPassword(email,pw);
      const usersSnap=await col('users').limit(2).get();
      const isFirst=usersSnap.docs.filter(d=>d.id!==user.uid).length===0;
      await col('users').doc(user.uid).set({full_name:name,phone:'',role:isFirst?'admin':'helper',avatar_color:randColor(),group_id:groupId,created_at:ts()});
      await col('memberships').add({user_id:user.uid,group_id:groupId,role:'member',created_at:ts()});
    }catch(err){setMsg(err.message);}
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-green-700 to-green-900 flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8"><div className="text-5xl mb-3">⚽</div><h1 className="text-3xl font-bold text-white">{APP_NAME}</h1><p className="text-green-200 mt-1 text-sm">{TOURNAMENT_NAME}</p></div>
        <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
          <div className="flex border-b">{[['login','🔐 Anmelden'],['register','✍️ Registrieren']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} className={`flex-1 py-3.5 text-sm font-semibold transition-colors ${tab===v?'text-green-700 border-b-2 border-green-700 bg-green-50':'text-gray-500 hover:text-gray-700'}`}>{l}</button>)}</div>
          <form onSubmit={tab==='login'?login:register} className="p-6">
            {tab==='register'&&<>
              <Inp label="Vollständiger Name" value={name} onChange={e=>setName(e.target.value)} placeholder="Max Mustermann" required/>
              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-1">Orgagruppe</label>
                <select value={groupId} onChange={e=>setGroupId(e.target.value)} required className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                  <option value="">Bitte wählen…</option>
                  {groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}
                </select>
                {groupId && (() => { const g=groups.find(x=>x.id===groupId); return g ? <p className="text-xs text-gray-400 mt-1">👤 Verantwortliche: {g.description}</p> : null; })()}
              </div>
            </>}
            <Inp label="E-Mail" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@beispiel.de" required/>
            <Inp label="Passwort" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" required minLength={6}/>
            {msg&&<p className="text-sm text-red-500 mb-4">{msg}</p>}
            <Btn variant="green" size="lg" className="w-full" disabled={loading} type="submit">{loading?'⏳ Bitte warten…':tab==='login'?'Anmelden':'Konto erstellen'}</Btn>
          </form>
        </div>
      </div>
    </div>
  );
}

// ADMIN — DASHBOARD
// ══════════════════════════════════════════════════════════════
function AdminDashboard({profile}) {
  const [stats,setStats]=useState({helpers:0,groups:0,tasks:0,avail:0});
  const [recentTasks,setRecentTasks]=useState([]);
  const [dayStats,setDayStats]=useState([]);

  useEffect(()=>{(async()=>{
    const [users,groups,tasks,avails]=await Promise.all([getDocs(col('users')),getDocs(col('groups')),getDocs(col('tasks')),getDocs(col('availability'))]);
    const userMap=Object.fromEntries(users.map(u=>[u.id,u]));
    setStats({helpers:users.filter(u=>u.role==='helper').length,groups:groups.length,tasks:tasks.length,avail:avails.length});
    setRecentTasks(sortBy(tasks,'created_at',true).slice(0,5).map(t=>({...t,profile:t.assigned_to?userMap[t.assigned_to]:null})));
    const ds=TOURNAMENT_DAYS.map(d=>({...d,count:avails.filter(a=>(a.days||[]).includes(d.id)).length}));
    setDayStats(ds);
  })();},[]);

  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">Willkommen, {(profile.full_name||'').split(' ')[0]} 👋</h1>
      <p className="text-gray-500 mb-6 text-sm">{TOURNAMENT_NAME} · Admin</p>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {[{l:'Helfer',v:stats.helpers,i:'👤'},{l:'Orgagruppen',v:stats.groups,i:'🏢'},{l:'Aufgaben',v:stats.tasks,i:'✅'},{l:'Verfügbarkeiten',v:stats.avail,i:'📅'}].map(s=>(
          <div key={s.l} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><div className="text-2xl mb-2">{s.i}</div><div className="text-3xl font-bold">{s.v}</div><div className="text-sm text-gray-500 mt-1">{s.l}</div></div>
        ))}
      </div>
      <div className="grid lg:grid-cols-2 gap-5">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 className="font-semibold mb-4">📅 Helfer pro Tag</h2>
          <div className="space-y-3">
            {dayStats.map(d=>(
              <div key={d.id} className="flex items-center gap-3">
                <div className="w-24 text-sm font-medium">{d.label}</div>
                {d.note&&<span className="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">{d.note}</span>}
                <div className="flex-1 bg-gray-100 rounded-full h-3"><div className="h-3 rounded-full bg-green-500 transition-all" style={{width:`${stats.helpers>0?Math.round((d.count/Math.max(stats.helpers,1))*100):0}%`}}/></div>
                <span className="text-sm font-medium w-8 text-right">{d.count}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 className="font-semibold mb-4">✅ Neueste Aufgaben</h2>
          {recentTasks.length===0?<p className="text-gray-400 text-sm">Keine Aufgaben</p>:<div className="space-y-3">{recentTasks.map(t=><div key={t.id} className="flex items-center justify-between py-2 border-b last:border-0"><div><p className="text-sm font-medium">{t.title}</p><p className="text-xs text-gray-400">{t.profile?.full_name||'Nicht zugewiesen'}</p></div><Badge color={taskStatusColor[t.status]}>{taskStatusLabel[t.status]}</Badge></div>)}</div>}
        </div>
      </div>
    </div>
  );
}

// ADMIN — VERFÜGBARKEIT
// ══════════════════════════════════════════════════════════════
function AdminVerfügbarkeit() {
  const [avails,setAvails]=useState([]);
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [loading,setLoading]=useState(true);
  const [activeDay,setActiveDay]=useState('12.08');

  useEffect(()=>{(async()=>{
    const [a,u,g,m]=await Promise.all([getDocs(col('availability')),getDocs(col('users')),getDocs(col('groups')),getDocs(col('memberships'))]);
    setAvails(a);setUsers(u);setGroups(g);setMemberships(m);setLoading(false);
  })();},[]);

  const userMap=Object.fromEntries(users.map(u=>[u.id,u]));
  const groupMap=Object.fromEntries(groups.map(g=>[g.id,g]));
  const getUserGroup=(uid)=>{
    const m=memberships.find(x=>x.user_id===uid);
    return m?groupMap[m.group_id]:null;
  };

  const helpersForDay=(dayId)=>{
    return avails.filter(a=>(a.days||[]).includes(dayId)).map(a=>({...userMap[a.user_id],uid:a.user_id})).filter(u=>u&&u.full_name);
  };

  const day=TOURNAMENT_DAYS.find(d=>d.id===activeDay);
  const helpers=helpersForDay(activeDay);

  // Gruppiere nach Orgagruppe
  const byGroup={};
  helpers.forEach(h=>{
    const g=getUserGroup(h.uid||h.id);
    const key=g?g.id:'_none';
    if(!byGroup[key])byGroup[key]={group:g,helpers:[]};
    byGroup[key].helpers.push(h);
  });

  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">📅 Verfügbarkeit der Helfer</h1>
      <div className="flex gap-2 mb-6 flex-wrap">
        {TOURNAMENT_DAYS.map(d=>(
          <button key={d.id} onClick={()=>setActiveDay(d.id)}
            className={`px-4 py-2 rounded-xl text-sm font-medium transition-colors border ${activeDay===d.id?'bg-green-600 text-white border-green-600':'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
            <span>{d.label}</span>
            {d.note&&<span className={`ml-1 text-xs ${activeDay===d.id?'text-green-100':'text-orange-500'}`}>({d.note})</span>}
          </button>
        ))}
      </div>
      {loading?<Spinner/>:(
        <div>
          <div className="flex items-center gap-3 mb-4">
            <h2 className="text-lg font-semibold">{day?.label}</h2>
            <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">{helpers.length} Helfer verfügbar</span>
          </div>
          {helpers.length===0?(
            <div className="bg-white rounded-xl border border-gray-100 p-8 text-center text-gray-400">Noch keine Helfer für diesen Tag angemeldet</div>
          ):(
            <div className="space-y-4">
              {Object.values(byGroup).map((entry,i)=>(
                <div key={i} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className="px-4 py-3 border-b flex items-center gap-2" style={{background: entry.group ? entry.group.color+'15' : '#f9fafb'}}>
                    <span className="text-lg">{entry.group?.icon||'👤'}</span>
                    <span className="font-semibold" style={{color: entry.group?.color||'#374151'}}>{entry.group?.name||'Ohne Gruppe'}</span>
                    <span className="ml-auto text-sm text-gray-400">{entry.helpers.length} Helfer</span>
                  </div>
                  <div className="divide-y">
                    {entry.helpers.map((h,j)=>(
                      <div key={j} className="flex items-center gap-3 px-4 py-3">
                        <Avatar name={h.full_name} color={h.avatar_color} size="sm"/>
                        <span className="text-sm font-medium">{h.full_name}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ADMIN — HELFER
// ══════════════════════════════════════════════════════════════
function AdminHelpers({show}) {
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [avails,setAvails]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [sel,setSel]=useState(null);
  const [addGrp,setAddGrp]=useState('');

  const load=async()=>{
    setLoading(true);
    const [u,g,m,a]=await Promise.all([getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name')),getDocs(col('memberships')),getDocs(col('availability'))]);
    setUsers(u);setGroups(g);setMemberships(m);setAvails(a);setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const assignGroup=async()=>{if(!addGrp||!sel)return;if(memberships.find(m=>m.user_id===sel.id&&m.group_id===addGrp))return;await col('memberships').add({user_id:sel.id,group_id:addGrp,role:'member',created_at:ts()});load();setAddGrp('');show('Gruppe zugewiesen');};
  const removeFromGroup=async(uid,gid)=>{const m=memberships.find(x=>x.user_id===uid&&x.group_id===gid);if(m)await col('memberships').doc(m.id).delete();load();};
  const toggleAdmin=async(u)=>{const r=u.role==='admin'?'helper':'admin';await col('users').doc(u.id).update({role:r});load();show(`${u.full_name} ist jetzt ${r==='admin'?'Admin':'Helfer'}`);};

  const filtered=users.filter(u=>(u.full_name||'').toLowerCase().includes(search.toLowerCase()));
  const userGroups=(uid)=>memberships.filter(m=>m.user_id===uid).map(m=>groups.find(g=>g.id===m.group_id)).filter(Boolean);
  const getUserAvail=(uid)=>{const a=avails.find(x=>x.user_id===uid);return a?a.days||[]:[];};
  const assignedGroups=sel?userGroups(sel.id):[];
  const availableGroups=groups.filter(g=>!assignedGroups.find(ag=>ag.id===g.id)&&!g.no_helpers);

  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">👤 Helfer verwalten</h1>
      <input value={search} onChange={e=>setSearch(e.target.value)} className="border border-gray-300 rounded-lg px-3 py-2 text-sm w-full max-w-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Suchen…"/>
      {loading?<Spinner/>:(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 border-b"><tr>

// ADMIN — ORGAGRUPPEN
// ══════════════════════════════════════════════════════════════
function AdminGroups({show}) {
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=async()=>{
    setLoading(true);
    const [g,m,u]=await Promise.all([getDocs(col('groups').orderBy('name')),getDocs(col('memberships')),getDocs(col('users'))]);
    setGroups(g);setMemberships(m);setUsers(u);setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const userMap=Object.fromEntries(users.map(u=>[u.id,u]));
  const groupMembers=(gid)=>memberships.filter(m=>m.group_id===gid).map(m=>userMap[m.user_id]).filter(Boolean);

  return (
    <div>
      <h1 className="text-2xl font-bold mb-2">🏢 Orgagruppen</h1>
      <p className="text-gray-400 text-sm mb-5">Die Gruppen wurden automatisch angelegt.</p>
      {loading?<Spinner/>:(
        <div className="grid md:grid-cols-2 gap-4">
          {groups.map(g=>{
            const mems=groupMembers(g.id);
            return (
              <div key={g.id} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div className="flex items-start gap-3 mb-3">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0" style={{background:g.color+'20'}}>{g.icon}</div>
                  <div className="flex-1">
                    <h3 className="font-semibold">{g.name}</h3>
                    <p className="text-xs text-gray-400">👤 {g.description}</p>
                    {g.no_helpers&&<span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full mt-1 inline-block">Kein weiterer Helfer benötigt</span>}
                  </div>
                  <div className="w-3 h-3 rounded-full flex-shrink-0 mt-1" style={{background:g.color}}/>
                </div>
                {mems.length>0&&(
                  <div>
                    <p className="text-xs text-gray-400 mb-2">{mems.length} angemeldete Helfer:</p>
                    <div className="flex flex-wrap gap-2">
                      {mems.map(u=>(
                        <div key={u.id} className="flex items-center gap-1.5 bg-gray-50 rounded-full px-2 py-1">
                          <Avatar name={u.full_name} color={u.avatar_color} size="sm"/>
                          <span className="text-xs">{u.full_name}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {mems.length===0&&!g.no_helpers&&<p className="text-xs text-gray-400">Noch keine Helfer angemeldet</p>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ADMIN — AUFGABEN

function AdminTasks({show}) {
  const [tasks,setTasks]=useState([]);
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showForm,setShowForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const [filter,setFilter]=useState('all');
  const [form,setForm]=useState({title:'',description:'',group_id:'',assigned_to:'',priority:'normal',status:'open',location:''});

  const load=async()=>{setLoading(true);const [t,u,g]=await Promise.all([getDocs(col('tasks')),getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name'))]);const uMap=Object.fromEntries(u.map(x=>[x.id,x]));const gMap=Object.fromEntries(g.map(x=>[x.id,x]));setTasks(sortBy(t,'created_at',true).map(x=>({...x,profile:x.assigned_to?uMap[x.assigned_to]:null,group:x.group_id?gMap[x.group_id]:null})));setUsers(u);setGroups(g);setLoading(false);};
  useEffect(()=>{load();},[]);

  const save=async()=>{if(!form.title.trim())return;const uid=auth.currentUser?.uid;const data={...form,group_id:form.group_id||null,assigned_to:form.assigned_to||null};if(editing)await col('tasks').doc(editing.id).update(data);else await col('tasks').add({...data,created_by:uid,created_at:ts()});load();setShowForm(false);show(editing?'Aufgabe aktualisiert':'Aufgabe erstellt');};
  const del=async(t)=>{if(!confirm(`Aufgabe "${t.title}" löschen?`))return;await col('tasks').doc(t.id).delete();load();show('Aufgabe gelöscht');};
  const filtered=filter==='all'?tasks:tasks.filter(t=>t.status===filter);

  return (
    <div>
      <div className="flex items-center justify-between mb-5"><h1 className="text-2xl font-bold">✅ Aufgaben</h1><Btn onClick={()=>{setEditing(null);setForm({title:'',description:'',group_id:'',assigned_to:'',priority:'normal',status:'open',location:''});setShowForm(true);}}>+ Neue Aufgabe</Btn></div>
      <div className="flex gap-2 mb-4 flex-wrap">{[['all','Alle'],['open','Offen'],['in_progress','In Arbeit'],['done','Erledigt']].map(([v,l])=><button key={v} onClick={()=>setFilter(v)} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${filter===v?'bg-blue-600 text-white':'bg-white text-gray-600 border hover:bg-gray-50'}`}>{l}</button>)}</div>
      {loading?<Spinner/>:(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 border-b"><tr>
              <th className="text-left px-4 py-3 font-medium text-gray-500">Aufgabe</th>
              <th className="text-left px-4 py-3 font-medium text-gray-500 hidden md:table-cell">Gruppe</th>
              <th className="text-left px-4 py-3 font-medium text-gray-500 hidden md:table-cell">Zugewiesen</th>
              <th className="text-left px-4 py-3 font-medium text-gray-500">Status</th>
              <th className="px-4 py-3"/>
            </tr></thead>
            <tbody>
              {filtered.map(t=>(
                <tr key={t.id} className="border-b last:border-0 hover:bg-gray-50">
                  <td className="px-4 py-3"><p className="font-medium">{t.title}</p><Badge color={priorityColor[t.priority]}>{priorityLabel[t.priority]}</Badge></td>
                  <td className="px-4 py-3 hidden md:table-cell">{t.group?<span className="text-xs px-2 py-0.5 rounded-full text-white" style={{background:t.group.color}}>{t.group.icon} {t.group.name}</span>:<span className="text-gray-400">—</span>}</td>
                  <td className="px-4 py-3 hidden md:table-cell">{t.profile?<div className="flex items-center gap-2"><Avatar name={t.profile.full_name} color={t.profile.avatar_color} size="sm"/><span>{t.profile.full_name}</span></div>:<span className="text-gray-400">—</span>}</td>
                  <td className="px-4 py-3"><Badge color={taskStatusColor[t.status]}>{taskStatusLabel[t.status]}</Badge></td>
                  <td className="px-4 py-3 text-right"><div className="flex gap-1 justify-end">
                    <Btn variant="ghost" size="sm" onClick={()=>{setEditing(t);setForm({title:t.title,description:t.description||'',group_id:t.group_id||'',assigned_to:t.assigned_to||'',priority:t.priority,status:t.status,location:t.location||''});setShowForm(true);}}>✏️</Btn>
                    <Btn variant="danger" size="sm" onClick={()=>del(t)}>🗑️</Btn>
                  </div></td>
                </tr>
              ))}
              {filtered.length===0&&<tr><td colSpan={5} className="px-4 py-8 text-center text-gray-400">Keine Aufgaben</td></tr>}
            </tbody>
          </table>
        </div>
      )}
      {showForm&&(
        <Modal title={editing?'Aufgabe bearbeiten':'Neue Aufgabe'} onClose={()=>setShowForm(false)} wide>
          <div className="grid grid-cols-2 gap-x-4">
            <div className="col-span-2"><Inp label="Titel" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} required/></div>
            <div className="col-span-2"><Txt label="Beschreibung" value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div>
            <Sel label="Gruppe" value={form.group_id} onChange={e=>setForm({...form,group_id:e.target.value})}><option value="">Keine Gruppe</option>{groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}</Sel>
            <Sel label="Zugewiesen an" value={form.assigned_to} onChange={e=>setForm({...form,assigned_to:e.target.value})}><option value="">Nicht zugewiesen</option>{users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}</Sel>
            <Sel label="Priorität" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option value="low">Niedrig</option><option value="normal">Normal</option><option value="high">Hoch</option></Sel>
            <Sel label="Status" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}><option value="open">Offen</option><option value="in_progress">In Arbeit</option><option value="done">Erledigt</option></Sel>
            <div className="col-span-2"><Inp label="Ort / Station" value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="z.B. Eingang Nord"/></div>
          </div>
          <div className="flex justify-end gap-3"><Btn variant="secondary" onClick={()=>setShowForm(false)}>Abbrechen</Btn><Btn onClick={save} disabled={!form.title.trim()}>{editing?'Speichern':'Erstellen'}</Btn></div>
        </Modal>
      )}
    </div>
  );
}

// ADMIN — BENACHRICHTIGUNGEN
// ══════════════════════════════════════════════════════════════
function AdminNotifications({show}) {
  const [users,setUsers]=useState([]);
  const [groups,setGroups]=useState([]);
  const [memberships,setMemberships]=useState([]);
  const [form,setForm]=useState({title:'',message:'',type:'info',target:'all',group_id:'',user_id:''});
  const [sending,setSending]=useState(false);
  useEffect(()=>{(async()=>{const [u,g,m]=await Promise.all([getDocs(col('users').orderBy('full_name')),getDocs(col('groups').orderBy('name')),getDocs(col('memberships'))]);setUsers(u);setGroups(g);setMemberships(m);})();},[]);
  const send=async()=>{
    if(!form.title.trim()||!form.message.trim())return;setSending(true);
    let recipients=[];
    if(form.target==='all')recipients=users.map(u=>u.id);
    else if(form.target==='group')recipients=memberships.filter(m=>m.group_id===form.group_id).map(m=>m.user_id);
    else if(form.target==='single'&&form.user_id)recipients=[form.user_id];
    if(recipients.length===0){show('Keine Empfänger','error');setSending(false);return;}
    const batch=db.batch();
    recipients.forEach(uid=>{const ref=col('notifications').doc();batch.set(ref,{user_id:uid,title:form.title,message:form.message,type:form.type,read:false,created_at:ts()});});
    await batch.commit();
    show(`Gesendet an ${recipients.length} Person(en)`);
    setForm({title:'',message:'',type:'info',target:'all',group_id:'',user_id:''});setSending(false);
  };
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">🔔 Benachrichtigungen senden</h1>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 max-w-2xl">
        <Inp label="Titel" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="z.B. Wichtige Information"/>
        <Txt label="Nachricht" value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Deine Nachricht…"/>
        <div className="grid grid-cols-2 gap-4">
          <Sel label="Typ" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}><option value="info">ℹ️ Info</option><option value="success">✅ Erfolg</option><option value="warning">⚠️ Warnung</option><option value="error">❌ Dringend</option></Sel>
          <Sel label="Empfänger" value={form.target} onChange={e=>setForm({...form,target:e.target.value,group_id:'',user_id:''})}><option value="all">Alle Helfer</option><option value="group">Gruppe</option><option value="single">Einzelne Person</option></Sel>
        </div>
        {form.target==='group'&&<Sel label="Gruppe" value={form.group_id} onChange={e=>setForm({...form,group_id:e.target.value})}><option value="">Gruppe wählen…</option>{groups.map(g=><option key={g.id} value={g.id}>{g.icon} {g.name}</option>)}</Sel>}
        {form.target==='single'&&<Sel label="Person" value={form.user_id} onChange={e=>setForm({...form,user_id:e.target.value})}><option value="">Person wählen…</option>{users.map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}</Sel>}
        <div className="flex justify-end"><Btn onClick={send} disabled={sending||!form.title.trim()||!form.message.trim()}>{sending?'⏳ Sende…':'📤 Senden'}</Btn></div>
      </div>
    </div>
  );
}

function HelperDashboard({profile}) {
  const [myTasks,setMyTasks]=useState([]);
  const [myGroup,setMyGroup]=useState(null);
  const [myDays,setMyDays]=useState([]);
  const [unread,setUnread]=useState(0);

  useEffect(()=>{(async()=>{
    const uid=profile.id;
    const [tasks,membs,notifs,avail]=await Promise.all([
      getDocs(col('tasks').where('assigned_to','==',uid)),
      getDocs(col('memberships').where('user_id','==',uid)),
      getDocs(col('notifications').where('user_id','==',uid).where('read','==',false)),
      getDoc_(col('availability').doc(uid)),
    ]);
    setMyTasks(tasks.filter(t=>t.status!=='done'));
    setUnread(notifs.length);
    setMyDays(avail?.days||[]);
    if(membs.length>0){const g=await getDoc_(col('groups').doc(membs[0].group_id));setMyGroup(g);}
  })();},[profile]);

  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">Hallo, {(profile.full_name||'').split(' ')[0]} 👋</h1>
      <p className="text-gray-500 mb-5 text-sm">{TOURNAMENT_NAME}</p>

      {myGroup&&(
        <div className="rounded-xl p-4 mb-5 text-white" style={{background:myGroup.color}}>
          <div className="flex items-center gap-3">
            <span className="text-3xl">{myGroup.icon}</span>
            <div><p className="font-bold text-lg">{myGroup.name}</p><p className="text-sm opacity-80">Verantwortliche: {myGroup.description}</p></div>
          </div>
        </div>
      )}

      {unread>0&&<div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-5 flex items-center gap-3"><span className="text-2xl">🔔</span><div><p className="font-medium text-blue-900">{unread} neue Benachrichtigung{unread!==1?'en':''}</p></div></div>}

      <div className="grid gap-5 md:grid-cols-2">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 className="font-semibold mb-4">📅 Meine Verfügbarkeit</h2>
          {myDays.length===0?<p className="text-gray-400 text-sm">Noch keine Tage ausgewählt</p>:(
            <div className="flex flex-wrap gap-2">
              {TOURNAMENT_DAYS.filter(d=>myDays.includes(d.id)).map(d=>(
                <span key={d.id} className="bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-sm font-medium">{d.label}{d.note?` · ${d.note}`:''}</span>
              ))}
            </div>
          )}
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 className="font-semibold mb-4">✅ Meine Aufgaben ({myTasks.length})</h2>
          {myTasks.length===0?<p className="text-gray-400 text-sm">Keine offenen Aufgaben 🎉</p>:<div className="space-y-2">{myTasks.slice(0,5).map(t=><div key={t.id} className="flex items-center justify-between py-2 border-b last:border-0"><p className="text-sm font-medium">{t.title}</p><Badge color={taskStatusColor[t.status]}>{taskStatusLabel[t.status]}</Badge></div>)}</div>}
        </div>
      </div>
    </div>
  );
}

// HELFER — VERFÜGBARKEIT
// ══════════════════════════════════════════════════════════════
function HelperVerfügbarkeit({profile,show}) {
  const [selectedDays,setSelectedDays]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{(async()=>{
    const a=await getDoc_(col('availability').doc(profile.id));
    setSelectedDays(a?.days||[]);setLoading(false);
  })();},[profile]);

  const toggle=async(dayId)=>{
    const newDays=selectedDays.includes(dayId)?selectedDays.filter(d=>d!==dayId):[...selectedDays,dayId];
    setSelectedDays(newDays);setSaving(true);
    await col('availability').doc(profile.id).set({user_id:profile.id,days:newDays,updated_at:ts()},{merge:true});
    setSaving(false);show(newDays.includes(dayId)?`${dayId} hinzugefügt ✅`:`${dayId} entfernt`,'info');
  };

  if(loading)return <Spinner/>;

  return (
    <div>
      <h1 className="text-2xl font-bold mb-2">📅 Meine Verfügbarkeit</h1>
      <p className="text-gray-500 mb-6 text-sm">Klicke auf die Tage, an denen du helfen kannst. {saving&&<span className="text-blue-500">⏳ Wird gespeichert…</span>}</p>

      <div className="grid gap-4 md:grid-cols-5">
        {TOURNAMENT_DAYS.map(d=>{
          const selected=selectedDays.includes(d.id);
          return (
            <button key={d.id} onClick={()=>toggle(d.id)}
              className={`p-5 rounded-2xl border-2 text-center transition-all ${selected?'border-green-500 bg-green-50':'border-gray-200 bg-white hover:border-gray-300'}`}>
              <div className={`text-3xl mb-2 ${selected?'':'grayscale opacity-50'}`}>
                {d.id==='12.08'?'🔧':d.id==='16.08'?'📦':'⚽'}
              </div>
              <div className={`font-bold text-lg ${selected?'text-green-700':'text-gray-600'}`}>{d.label}</div>
              {d.note&&<div className={`text-xs mt-1 font-medium ${selected?'text-green-600':'text-orange-500'}`}>{d.note}</div>}
              <div className={`mt-3 w-7 h-7 rounded-full border-2 mx-auto flex items-center justify-center ${selected?'bg-green-500 border-green-500 text-white':'border-gray-300'}`}>
                {selected&&<span className="text-sm">✓</span>}
              </div>
            </button>
          );
        })}
      </div>

      <div className="mt-6 bg-white rounded-xl border border-gray-100 p-5">
        <h3 className="font-semibold mb-3">Deine Auswahl</h3>
        {selectedDays.length===0?<p className="text-gray-400 text-sm">Noch keine Tage ausgewählt</p>:(
          <div className="flex flex-wrap gap-2">
            {TOURNAMENT_DAYS.filter(d=>selectedDays.includes(d.id)).map(d=>(
              <span key={d.id} className="bg-green-100 text-green-700 px-4 py-2 rounded-xl text-sm font-medium">{d.label}{d.note?` (${d.note})`:''}</span>
            ))}
          </div>
        )}
        <p className="text-xs text-gray-400 mt-3">Wird automatisch gespeichert wenn du klickst.</p>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// HELFER — AUFGABEN
// ══════════════════════════════════════════════════════════════
function HelperTasks({profile,show}) {
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const load=async()=>{setLoading(true);const [t,g]=await Promise.all([getDocs(col('tasks').where('assigned_to','==',profile.id)),getDocs(col('groups'))]);const gMap=Object.fromEntries(g.map(x=>[x.id,x]));setTasks(sortBy(t,'created_at',true).map(x=>({...x,group:x.group_id?gMap[x.group_id]:null})));setLoading(false);};
  useEffect(()=>{load();},[profile]);
  const updateStatus=async(id,status)=>{await col('tasks').doc(id).update({status});load();show('Status aktualisiert');};
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">✅ Meine Aufgaben</h1>
      {loading?<Spinner/>:<div className="space-y-3">
        {tasks.map(t=>(
          <div key={t.id} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
            <div className="flex items-start justify-between">
              <div className="flex-1">
                <div className="flex items-center gap-2 flex-wrap mb-1"><h3 className="font-semibold">{t.title}</h3><Badge color={priorityColor[t.priority]}>{priorityLabel[t.priority]}</Badge>{t.group&&<span className="text-xs px-2 py-0.5 rounded-full text-white" style={{background:t.group.color}}>{t.group.icon} {t.group.name}</span>}</div>
                {t.description&&<p className="text-sm text-gray-500 mb-2">{t.description}</p>}
                {t.location&&<p className="text-xs text-gray-400">📍 {t.location}</p>}
              </div>
              <div className="ml-4"><Sel value={t.status} onChange={e=>updateStatus(t.id,e.target.value)}><option value="open">Offen</option><option value="in_progress">In Arbeit</option><option value="done">Erledigt</option></Sel></div>
            </div>
          </div>
        ))}
        {tasks.length===0&&<p className="text-gray-400 text-sm">Keine Aufgaben zugewiesen.</p>}
      </div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// BENACHRICHTIGUNGEN
// ══════════════════════════════════════════════════════════════
function NotificationsPage({profile}) {
  const [notifs,setNotifs]=useState([]);
  const [loading,setLoading]=useState(true);
  const load=async()=>{setLoading(true);const n=await getDocs(col('notifications').where('user_id','==',profile.id));setNotifs(sortBy(n,'created_at',true));setLoading(false);};
  useEffect(()=>{load();},[profile]);
  const markRead=async(id)=>{await col('notifications').doc(id).update({read:true});setNotifs(n=>n.map(x=>x.id===id?{...x,read:true}:x));};
  const markAll=async()=>{const batch=db.batch();notifs.filter(n=>!n.read).forEach(n=>batch.update(col('notifications').doc(n.id),{read:true}));await batch.commit();setNotifs(n=>n.map(x=>({...x,read:true})));};
  const typeIcon={info:'ℹ️',success:'✅',warning:'⚠️',error:'❌'};
  const typeBg={info:'border-blue-100',success:'border-green-100',warning:'border-yellow-100',error:'border-red-100'};
  const unread=notifs.filter(n=>!n.read).length;
  return (
    <div>
      <div className="flex items-center justify-between mb-5"><h1 className="text-2xl font-bold">🔔 Benachrichtigungen {unread>0&&<span className="ml-2 text-sm font-normal bg-red-100 text-red-600 px-2 py-0.5 rounded-full">{unread} neu</span>}</h1>{unread>0&&<Btn variant="secondary" size="sm" onClick={markAll}>Alle gelesen</Btn>}</div>
      {loading?<Spinner/>:<div className="space-y-2">
        {notifs.map(n=>(
          <div key={n.id} onClick={()=>!n.read&&markRead(n.id)} className={`bg-white rounded-xl border ${typeBg[n.type]||'border-gray-100'} p-4 cursor-pointer`}>
            <div className="flex items-start gap-3">
              <span className="text-xl">{typeIcon[n.type]||'ℹ️'}</span>
              <div className="flex-1"><p className={`text-sm ${!n.read?'font-semibold':''}`}>{n.title}</p><p className="text-sm text-gray-600 mt-0.5">{n.message}</p></div>
              {!n.read&&<div className="w-2 h-2 rounded-full bg-blue-500 mt-1.5"/>}
            </div>
          </div>
        ))}
        {notifs.length===0&&<p className="text-gray-400 text-sm">Keine Benachrichtigungen</p>}
      </div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// HELFER — PROFIL
// ══════════════════════════════════════════════════════════════
function HelperProfile({profile,show,onUpdate}) {
  const [form,setForm]=useState({full_name:profile.full_name||'',phone:profile.phone||''});
  const [pw,setPw]=useState('');
  const [myGroup,setMyGroup]=useState(null);
  useEffect(()=>{(async()=>{const m=await getDocs(col('memberships').where('user_id','==',profile.id));if(m.length>0){const g=await getDoc_(col('groups').doc(m[0].group_id));setMyGroup(g);}})();},[profile]);
  const save=async()=>{await col('users').doc(profile.id).update(form);onUpdate({...profile,...form});show('Profil gespeichert');};
  const changePw=async()=>{if(pw.length<6){show('Mindestens 6 Zeichen','error');return;}try{await auth.currentUser.updatePassword(pw);show('Passwort geändert');setPw('');}catch(e){show(e.message,'error');}};
  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">👤 Mein Profil</h1>
      {myGroup&&<div className="rounded-xl p-4 mb-5 text-white flex items-center gap-3" style={{background:myGroup.color}}><span className="text-2xl">{myGroup.icon}</span><div><p className="font-bold">{myGroup.name}</p><p className="text-sm opacity-80">{myGroup.description}</p></div></div>}
      <div className="grid md:grid-cols-2 gap-5">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><h2 className="font-semibold mb-4">Persönliche Daten</h2><div className="flex items-center gap-4 mb-5"><Avatar name={profile.full_name} color={profile.avatar_color} size="lg"/><div><p className="font-semibold">{profile.full_name}</p><Badge color={profile.role==='admin'?'purple':'gray'}>{profile.role==='admin'?'Admin':'Helfer'}</Badge></div></div><Inp label="Name" value={form.full_name} onChange={e=>setForm({...form,full_name:e.target.value})}/><Inp label="Telefon" type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+49 …"/><Btn onClick={save}>Speichern</Btn></div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><h2 className="font-semibold mb-4">Passwort ändern</h2><Inp label="Neues Passwort" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Mind. 6 Zeichen"/><Btn onClick={changePw} disabled={pw.length<6}>Passwort ändern</Btn></div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// SEITENLEISTE
// ══════════════════════════════════════════════════════════════
function Sidebar({nav,active,setActive,profile,unread,onLogout,mobileOpen,setMobileOpen}) {
  return (
    <>
      {mobileOpen&&<div className="fixed inset-0 z-20 bg-black/40 md:hidden" onClick={()=>setMobileOpen(false)}/>}
      <aside className={`fixed md:static inset-y-0 left-0 z-30 w-64 flex-shrink-0 bg-gradient-to-b from-green-800 to-green-900 text-white flex flex-col transition-transform duration-200 ${mobileOpen?'translate-x-0':'-translate-x-full md:translate-x-0'}`}>
        <div className="p-5 border-b border-green-700"><div className="flex items-center gap-2"><span className="text-2xl">⚽</span><div><p className="font-bold text-sm">{APP_NAME}</p><p className="text-green-300 text-xs truncate max-w-[150px]">{TOURNAMENT_NAME}</p></div></div></div>
        <nav className="flex-1 p-3 space-y-1 overflow-y-auto">{nav.map(item=>(
          <button key={item.id} onClick={()=>{setActive(item.id);setMobileOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-left ${active===item.id?'bg-white/15 text-white':'text-green-100 hover:bg-white/10'}`}>
            <span className="text-lg">{item.icon}</span><span className="flex-1">{item.label}</span>
            {item.id==='notifications'&&unread>0&&<span className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{unread}</span>}
          </button>
        ))}</nav>
        <div className="p-3 border-t border-green-700">
          <div className="flex items-center gap-3 px-3 py-2 mb-1"><Avatar name={profile.full_name} color={profile.avatar_color} size="sm"/><div className="min-w-0"><p className="text-sm font-medium truncate">{profile.full_name}</p><p className="text-xs text-green-300">{profile.role==='admin'?'Admin':'Helfer'}</p></div></div>
          <button onClick={onLogout} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-green-200 hover:bg-white/10 transition-colors">🚪 Abmelden</button>
        </div>
      </aside>
    </>
  );
}

// ══════════════════════════════════════════════════════════════
// HAUPT-APP
// ══════════════════════════════════════════════════════════════
function App() {
  const [user,setUser]=useState(undefined);
  const [profile,setProfile]=useState(null);
  const [activePage,setActivePage]=useState('dashboard');
  const [unread,setUnread]=useState(0);
  const [mobileOpen,setMobileOpen]=useState(false);
  const {show,Container}=useToast();
  const unsubRef=useRef(null);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(u)=>{
      setUser(u);
      if(u){
        await seedGroups();
        const p=await getDoc_(col('users').doc(u.uid));
        setProfile(p);
        if(unsubRef.current)unsubRef.current();
        unsubRef.current=col('notifications').where('user_id','==',u.uid).where('read','==',false).onSnapshot(snap=>{setUnread(snap.size);});
      }else{setProfile(null);if(unsubRef.current)unsubRef.current();}
    });
    return()=>{unsub();if(unsubRef.current)unsubRef.current();};
  },[]);

  const logout=async()=>{await auth.signOut();setActivePage('dashboard');};

  if(user===undefined)return <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-700 to-green-900"><div className="text-center text-white"><div className="text-5xl mb-4">⚽</div><div className="w-8 h-8 border-4 border-white/30 border-t-white rounded-full animate-spin mx-auto"/></div></div>;
  if(!user||!profile)return <><LoginPage/><Container/></>;

  const isAdmin=profile.role==='admin';
  const nav=isAdmin
    ?[{id:'dashboard',icon:'🏠',label:'Dashboard'},{id:'helpers',icon:'👥',label:'Helfer'},{id:'groups',icon:'🏢',label:'Orgagruppen'},{id:'tasks',icon:'✅',label:'Aufgaben'},{id:'availability',icon:'📅',label:'Verfügbarkeit'},{id:'notifications',icon:'🔔',label:'Benachrichtigungen'}]
    :[{id:'dashboard',icon:'🏠',label:'Übersicht'},{id:'availability',icon:'📅',label:'Meine Verfügbarkeit'},{id:'tasks',icon:'✅',label:'Meine Aufgaben'},{id:'notifications',icon:'🔔',label:'Benachrichtigungen'},{id:'profile',icon:'👤',label:'Mein Profil'}];

  const renderPage=()=>{
    if(isAdmin)switch(activePage){
      case 'dashboard':     return <AdminDashboard profile={profile}/>;
      case 'helpers':       return <AdminHelpers show={show}/>;
      case 'groups':        return <AdminGroups show={show}/>;
      case 'tasks':         return <AdminTasks show={show}/>;
      case 'availability':  return <AdminVerfügbarkeit/>;
      case 'notifications': return <AdminNotifications show={show}/>;
      default:              return <AdminDashboard profile={profile}/>;
    }
    switch(activePage){
      case 'dashboard':     return <HelperDashboard profile={profile}/>;
      case 'availability':  return <HelperVerfügbarkeit profile={profile} show={show}/>;
      case 'tasks':         return <HelperTasks profile={profile} show={show}/>;
      case 'notifications': return <NotificationsPage profile={profile}/>;
      case 'profile':       return <HelperProfile profile={profile} show={show} onUpdate={setProfile}/>;
      default:              return <HelperDashboard profile={profile}/>;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar nav={nav} active={activePage} setActive={setActivePage} profile={profile} unread={unread} onLogout={logout} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div className="flex-1 flex flex-col overflow-hidden">
        <div className="md:hidden flex items-center justify-between px-4 py-3 bg-white border-b"><button onClick={()=>setMobileOpen(true)} className="p-2 rounded-lg hover:bg-gray-100 text-xl">☰</button><span className="font-semibold text-sm">{APP_NAME}</span><div className="w-8"/></div>
        <main className="flex-1 overflow-y-auto p-5 md:p-8"><div className="max-w-5xl mx-auto">{renderPage()}</div></main>
      </div>
      <Container/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
